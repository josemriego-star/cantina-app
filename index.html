<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B5E3B"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mercator"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<title>Mercator</title>
<style>
:root{--bg:#F4F9F4;--card:#FFFFFF;--ink:#37474F;--mut:#5F6F76;--soft:#8A97A0;--line:#E6E9EE;--line2:#EEF0F3;--blue:#1B5E3B;--navy:#1B5E3B;--sky:#DFF5E1;--band:#1B5E3B;--yel:#43A047;--cr:#F5BE41;--red:#BE2835;--ok:#43A047;--okbg:#DFF5E1;--okink:#1B5E3B;--crbg:#FAECE7;--crink:#712B13;--bad:#C94F4F;--ambbg:#FFF4DD;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.35 'Open Sans','Noto Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:600px;margin:0 auto;padding:12px 16px calc(110px + env(safe-area-inset-bottom,0px))}
#est{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px);background:var(--band)}
.est{max-width:600px;margin:0 auto;padding:6px 16px;font-size:13px;font-weight:600;color:var(--okink);background:var(--okbg);text-align:center}
.est.wr{color:#7a5a10;background:var(--ambbg)}.est.bad{color:var(--crink);background:var(--crbg)}
h1{font-size:24px;font-weight:700;letter-spacing:-.2px;margin:8px 0 14px}small,.mut{color:var(--mut);font-weight:400;font-size:14px}
.top,.hero{margin:-12px -16px 18px;padding:14px 16px 16px;background:var(--band);color:#fff;display:flex;align-items:center;gap:10px}.top h1,.hero h1{color:#fff}.hero{margin-bottom:14px}.hero h1{text-align:left}.ic{width:38px;height:38px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}.ic img{width:30px;height:30px}.hola{font-size:22px;font-weight:700;color:var(--navy);margin:0 0 2px}.brand{display:flex;align-items:center;gap:10px;margin:4px 0 8px}.brand .ic{background:transparent;width:44px;height:44px}.brand .ic img{width:44px;height:44px}.brand b{font-size:26px;font-weight:700;color:var(--navy)}
.top h1,.hero h1{margin:0;font-size:22px;flex:1;text-align:center}
.hb::after{content:"";width:44px;flex:none}.hero{gap:12px}.hero .logo{width:56px;height:56px;flex:none}.hero h1{flex:none;text-align:left;font-size:30px;letter-spacing:-.3px}.nm em,.hero h1 em{font-style:normal;color:#66C46E}.bn{background:#1B5E3B;border-radius:24px;padding:22px 16px 16px;margin:4px 0 18px;color:#fff;text-align:center}.bn .r{display:flex;align-items:center;justify-content:center;gap:10px}.bn img{width:92px;height:92px;flex:none}.bn .nm{font-size:42px;font-weight:700;line-height:1;letter-spacing:-.5px}.bn p{margin:8px 0 0;font-size:17px;color:#fff}.bn svg{display:block;margin:2px auto 0}.qt svg{width:38px;height:38px}
.back{width:44px;height:44px;flex:none;border:0;border-radius:50%;background:#DFF5E1;color:#1B5E3B;font-family:inherit;font-size:22px}
.sec{font-size:20px;font-weight:700;margin:18px 0 12px}
.b{display:block;width:100%;min-height:52px;border:0;border-radius:14px;font-family:inherit;font-weight:500;font-size:17px;color:#fff;background:var(--blue);margin:0 0 10px;cursor:pointer}
.b:disabled{opacity:.35}.b.ok{background:var(--blue)}.b.cr{background:var(--yel);color:#fff}.b.og{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}.b.bad{background:var(--red)}.b.gy{background:var(--sky);color:var(--ink)}
.b.ghost{background:transparent;color:var(--ink);border:1px solid #CBD2DC;min-height:48px;font-size:16px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.qt{min-height:104px;border:0;border-radius:18px;font-family:inherit;font-weight:500;font-size:16px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.qt i{font-style:normal;font-size:32px;line-height:1}
.qt.n{background:var(--navy)}.qt.y{background:var(--yel);color:#fff}.qt.s{background:var(--sky);color:var(--navy)}.qt.w{background:#fff;color:var(--navy);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.tile b{font-weight:600}.tile.on{border-color:var(--blue);background:var(--sky)}.tile span{color:var(--mut);font-size:15px}
.q{position:absolute;top:8px;right:10px;background:var(--blue);color:#fff;border-radius:10px;min-width:28px;text-align:center;font-style:normal;font-weight:600;padding:2px 8px}
.m{position:absolute;bottom:8px;right:8px;width:44px;height:44px;border-radius:12px;border:0;background:#fff;color:var(--ink);font-family:inherit;font-size:24px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;align-items:center;max-width:600px;margin:0 auto}
.bar>div{flex:1}.bar strong{display:block;font-size:22px;font-weight:700}.bar .b{margin:0;flex:1}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:8px 16px;margin-bottom:10px;min-height:56px;cursor:pointer}
.row>div{flex:1}.dot{width:14px;height:14px;border-radius:50%;flex:none}
.st{display:flex;align-items:center;gap:8px}.st button{width:48px;height:48px;border-radius:12px;border:0;background:var(--line2);color:var(--ink);font-family:inherit;font-size:24px}.st b{min-width:44px;text-align:center;font-size:20px;font-weight:700}
input,select{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);font-family:inherit;font-size:18px;padding:0 14px;margin-bottom:12px}
input:focus,select:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.full{position:fixed;inset:0;background:var(--ok);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}.full div{font-size:90px}
.er{color:var(--crink);background:var(--crbg);border-radius:10px;padding:8px 12px;font-size:15px;font-weight:600}.er:empty{display:none}
.dots{font-size:30px;text-align:center;min-height:52px;letter-spacing:8px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.kp button{min-height:64px;font-family:inherit;font-weight:500;font-size:24px;border:0;border-radius:14px;background:#fff;color:var(--ink)}
canvas{width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;touch-action:none;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line2)}th{color:var(--mut);font-weight:600;font-size:13px}td:first-child,th:first-child{text-align:left}
.pos{color:var(--okink)}.neg{color:var(--bad)}
.qi{width:84px;min-height:50px;margin:0;padding:0 4px;text-align:center;font-weight:700;font-size:21px}
.mi{position:relative}.mi span{position:absolute;right:16px;top:14px;font-size:18px;color:var(--soft)}.mi input{padding-right:56px}
@media(min-width:700px){#app,.est,.bar{max-width:880px}.grid{grid-template-columns:repeat(3,1fr)}.qa{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1100px){#app,.est,.bar{max-width:1000px}.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div id="est"></div><div id="app"></div>
<script src="config.js"></script>
<script>
const DEN=[100000,50000,20000,10000,5000,2000,1000,500,100];
let S={};try{S=JSON.parse(localStorage.getItem('cantina2'))||{}}catch(e){}
for(const k of ['q','prob','ult','cat','cli','stk'])S[k]=S[k]||[];
const save=()=>{try{localStorage.setItem('cantina2',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),fm=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.'),gs=n=>fm(n)+' Gs';
const monto=q=>parseInt(($(q).value||'').replace(/\D/g,''),10)||0;
const fmtMi=el=>{const n=el.value.replace(/\D/g,'');el.value=n?fm(Number(n)):''};
const mi=(id,v,ph)=>`<div class=mi><input id=${id} type=tel inputmode=numeric placeholder="${ph||'0'}" value="${v?fm(v):''}" oninput="fmtMi(this)"><span>Gs</span></div>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const uid=()=>(window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,12));
const base=()=>String(window.CANTINA_API||S.api||'').replace(/\/$/,'');
let V='boot',cart={},sel=null,cash={},cnt={},lote={},pin='',err='',msg='',cb=null,res=null,usr=[],pend=null,offConf=false,ptitle='',pback='users',psign=false,backTo='home',syncing=false,comp=null,pin1='',vsel=null,cq='',bq='',cp={prov:'',fac:'',monto:0,caja:'',lin:{}};

async function api(path,opt={},ms=70000){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{
    const r=await fetch(base()+path,{...opt,signal:c.signal,headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{}),...(opt.headers||{})}});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){const x=d.detail,e=new Error(typeof x==='string'?x:(x&&x.mensaje)||'Error ('+r.status+')');e.status=r.status;throw e}
    return d;
  }catch(e){if(!e.status){e.net=true;e.message='Sin conexión con el servidor'}throw e}finally{clearTimeout(t)}
}
const go=v=>{V=v;R()};
const hd=(t,b)=>`<div class="top${b?' hb':''}">${b?`<button class=back aria-label="Volver" onclick="go('${b}')">←</button>`:''}<h1>${t}</h1></div>`;
const kp=k=>{const[a,b]=String(k).split(':');return{pid:+a,vid:b?+b:null}};
const cartT=()=>Object.entries(cart).reduce((s,[k,q])=>s+q*S.cat.find(p=>p.id==kp(k).pid).precio,0);
const lineas=()=>Object.entries(cart).filter(([k,q])=>q>0).map(([k,q])=>{const{pid,vid}=kp(k);return {producto_id:pid,cantidad:q,...(vid?{variante_id:vid}:{})}});
const cons=(p,vid)=>p.combo?(((p.variantes||[]).find(v=>vid?v.id===vid:true)||{}).consumo||[]).map(c=>[c.item_id,c.cantidad]):p.receta.map(r=>[r.item_id,r.cantidad]);

/* ---------- estado y sincronización ---------- */
function est(){
  const n=S.q.length,p=S.prob.length,el=$('#est');
  if(!S.user){el.innerHTML='';return}
  el.innerHTML=S.exp?`<div class="est bad" onclick="loadUsers()">🔑 Sesión vencida · tocá para entrar</div>`
   :p?`<div class="est bad" onclick="go('prob')">⚠ ${p} sin registrar · tocá para ver</div>`
   :n?`<div class="est wr">🟡 ${n} por enviar${navigator.onLine?'':' · sin conexión'}</div>`
   :navigator.onLine?`<div class=est>🟢 Todo guardado</div>`:`<div class="est wr">🔴 Sin conexión</div>`;
}
async function sync(){
  if(syncing||!S.token)return;syncing=true;
  try{
    while(S.q.length){
      const op=S.q[0];
      try{
        const r=await api(op.path,{method:'POST',body:JSON.stringify(op.body)},30000);
        if(op.tipo==='venta'){S.ult.push({uuid:op.body.client_uuid,id:r.id});S.ult=S.ult.slice(-20)}
        S.q.shift();
      }catch(e){
        if(e.net)break;
        if(e.status===401&&!/PIN/.test(e.message)){S.exp=true;break}
        S.prob.push({tipo:op.tipo,error:e.message,fecha:Date.now()});S.q.shift();
      }
      save();est();
    }
    if(!S.q.length)await refrescar();
  }finally{syncing=false;save();est()}
}
async function refrescar(){
  try{
    S.turno=await api('/api/turnos/actual');
    if(!S.q.length){const[c,s,cl]=await Promise.all([api('/api/catalogo'),api('/api/stock'),api('/api/clientes')]);S.cat=c;S.stk=s;S.cli=cl}
    save();return true;
  }catch(e){if(e.status===401&&!S.q.length)S.exp=true;return false}
}
window.addEventListener('online',()=>{sync()});window.addEventListener('offline',est);
setInterval(()=>{if(S.q.length&&navigator.onLine)sync()},30000);

/* ---------- acceso ---------- */
async function loadUsers(){
  msg='Conectando con el servidor… la primera vez del día puede tardar hasta un minuto';go('wait');
  try{usr=await api('/api/usuarios/publico');go('users')}catch(e){msg=e.message;go('fail')}
}
function pinScr(t,back,fn,sign){ptitle=t;pback=back;cb=fn;psign=!!sign;pin='';go('pin')}
function key(k){
  if(k==='⌫')pin=pin.slice(0,-1);
  else if(k==='✓'){if(pin.length>=4){const p=pin;pin='';err='';cb(p)}return}
  else if(pin.length<8)pin+=k;
  R();
}
function pickUser(i){sel=usr[i];err='';pinScr('PIN de '+sel.nombre,'users',doLogin)}
async function doLogin(p){
  msg='Entrando…';go('wait');
  try{
    const r=await api('/api/login',{method:'POST',body:JSON.stringify({usuario_id:sel.id,pin:p})});
    S.token=r.token;S.user=r.usuario;S.exp=false;save();await refrescar();entrar();
  }catch(e){err=e.message;pinScr('PIN de '+sel.nombre,'users',doLogin)}
}
function entrar(){
  if(S.q.length)sync();
  if(!S.turno)return go('fondo');
  if(S.turno.user_id===S.user.id||S.user.rol==='admin')go('home');else go('otro');
}
async function abrirTurno(){
  const fondo=monto('#f');msg='Abriendo turno…';go('wait');
  try{await api('/api/turnos/abrir',{method:'POST',body:JSON.stringify({fondo})});await refrescar();go('home')}catch(e){msg=e.message;backTo='fondo';go('err')}
}
function salir(){S.token=null;S.user=null;S.exp=false;save();loadUsers()}

/* ---------- ventas y cobros ---------- */
function add(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);R()}
function fx(b,s){
  if(b.lineas){
    let t=0;
    b.lineas.forEach(l=>{const p=S.cat.find(x=>x.id==l.producto_id);if(!p)return;t+=p.precio*l.cantidad;
      cons(p,l.variante_id).forEach(([id,q])=>{const i=S.stk.find(x=>x.id==id);if(i)i.stock=Math.round((i.stock-s*q*l.cantidad)*1000)/1000})});
    if(b.tipo==='credito'){const c=S.cli.find(x=>x.id==b.cliente_id);if(c)c.saldo+=s*t}
  }else{const c=S.cli.find(x=>x.id==b.cliente_id);if(c)c.saldo-=s*b.monto}
}
function vender(t){cq='';
  pend={tipo:'venta',body:{tipo:t,lineas:lineas()}};
  if(t==='contado')go('medio');else go('client');
}
async function elegirCliente(id){sel=S.cli.find(c=>c.id===id);pend.body.cliente_id=id;await irConf()}
async function nuevoCliente(){
  const n=$('#nc').value.trim(),tel=$('#np').value.trim(),emp=$('#ne').value.trim();if(n.length<2)return;
  try{const r=await api('/api/clientes',{method:'POST',body:JSON.stringify({nombre:n,telefono:tel||null,empresa:emp||null})});S.cli.push({id:r.id,nombre:n,telefono:tel,empresa:emp||null,saldo:0,tiene_pin:false});save();await elegirCliente(r.id)}
  catch(e){msg=e.net?'Para agregar un cliente nuevo hace falta conexión':e.message;backTo='client';go('err')}
}
async function irConf(){
  if(S.q.length){msg='Enviando operaciones pendientes…';go('wait');await sync()}
  offConf=S.q.length>0||!navigator.onLine;err='';
  if(sel.tiene_pin&&!offConf)pinScr(sel.nombre+', ingresá tu PIN','client',p=>confirmar({cliente_pin:p}),true);else go('firma');
}
async function confirmar(extra){
  const op={tipo:pend.tipo,path:pend.tipo==='venta'?'/api/ventas':'/api/pagos',body:{...pend.body,...extra,client_uuid:uid()}};
  if(!offConf&&!S.q.length){
    try{msg='Registrando…';go('wait');const r=await api(op.path,{method:'POST',body:JSON.stringify(op.body)});return fin(op,r)}
    catch(e){
      if(!e.net){
        if(e.status===401&&!/PIN/.test(e.message)){S.exp=true;est();msg='La sesión venció. Entrá de nuevo; no se perdió nada.';backTo='home';return go('err')}
        if(/PIN/.test(e.message)){err=e.message;return pinScr(sel.nombre+', ingresá tu PIN','client',p=>confirmar({cliente_pin:p}),true)}
        msg=e.message;backTo='home';return go('err');
      }
      if(extra.cliente_pin){offConf=true;err='Se cortó la conexión: pedí que firme';return go('firma')}
    }
  }
  S.q.push(op);fin(op,null);
}
function fin(op,r){
  fx(op.body,1);
  const b=op.body,t=op.tipo==='venta'?b.lineas.reduce((s,l)=>s+l.cantidad*S.cat.find(p=>p.id==l.producto_id).precio,0):b.monto;
  if(op.tipo==='venta'){S.last={uuid:b.client_uuid,tipo:'venta',fx:{lineas:b.lineas,tipo:b.tipo,cliente_id:b.cliente_id}};if(r){S.ult.push({uuid:b.client_uuid,id:r.id});S.ult=S.ult.slice(-20)}}
  else S.last=null;
  msg=`${gs(t)} ${op.tipo==='pago'?'cobrado':b.tipo==='contado'?'al contado':'a crédito'}${b.medio&&b.medio!=='efectivo'?' · '+MN[b.medio]:''}${r?'':' · se enviará al volver internet'}`;
  comp=b.cliente_id?{tipo:op.tipo,cid:b.cliente_id,t,conf:b.cliente_pin?'PIN':'firma',fecha:Date.now(),
    lin:op.tipo==='venta'?b.lineas.map(l=>{const p=S.cat.find(x=>x.id==l.producto_id),v=l.variante_id&&(p.variantes||[]).find(x=>x.id===l.variante_id);return `${l.cantidad} × ${p.nombre}${v?' ('+v.nombre+')':''} × ${fm(p.precio)}`}):[]}:null;
  cart={};save();go('ok');if(!comp)setTimeout(()=>{if(V==='ok')go('home')},1400);
  if(r)refrescar().then(est);else sync();
}
async function undo(){
  const L=S.last;if(!L)return;
  const i=S.q.findIndex(o=>o.body.client_uuid===L.uuid);
  if(i>=0)S.q.splice(i,1);
  else{
    const u=S.ult.find(x=>x.uuid===L.uuid);if(!u)return;
    try{await api(`/api/ventas/${u.id}/anular`,{method:'POST',body:JSON.stringify({motivo:'Corrección de la empleada'})})}catch(e){msg=e.message;backTo='home';return go('err')}
  }
  fx(L.fx,-1);S.last=null;save();go('home');
}
function pagar(m){pend={tipo:'pago',body:{cliente_id:sel.id,monto:m}};go('medio')}
const MEDIOS=[['efectivo','Efectivo','cash','n'],['pos_debito','POS Débito','card','y'],['pos_credito','POS Crédito','cardpay','s'],['transferencia','Transferencia','bank','w']];
const MN=Object.fromEntries(MEDIOS.map(x=>[x[0],x[1]]));
function medioPago(k){pend.body.medio=k;delete pend.body.comprobante;if(k.startsWith('pos'))go('boleta');else sigue()}
function sigue(){if(pend.tipo==='venta'){offConf=!navigator.onLine;confirmar({})}else irConf()}
function boletaOk(){const v=$('#bo').value.trim();if(!v&&!confirm('¿Seguir sin el número de boleta del POS?'))return;if(v)pend.body.comprobante=v;sigue()}
function usarPin(){err='';pinScr(sel.nombre+', ingresá tu PIN','client',p=>confirmar({cliente_pin:p}),true)}
function crearPin(m){err=m||'';pinScr(sel.nombre+', elegí un PIN de 4 a 8 números (que lo escriba el cliente)','client',p=>{pin1=p;pinScr('Repetí el PIN','client',guardarPin)})}
async function guardarPin(p){
  if(p!==pin1)return crearPin('Los PIN no coinciden, probá de nuevo');
  msg='Guardando PIN…';go('wait');
  try{await api(`/api/clientes/${sel.id}/pin`,{method:'PUT',body:JSON.stringify({pin:p})});sel.tiene_pin=true;save();usarPin()}
  catch(e){msg=e.message;backTo='client';go('err')}
}
function enviarWA(){
  const c=S.cli.find(x=>x.id===comp.cid),f=new Date(comp.fecha).toLocaleString('es-PY');
  const txt=comp.tipo==='venta'
    ?`*Mercator · Compra a crédito*\nCliente: ${c.nombre}\nFecha: ${f}\n${comp.lin.join('\n')}\n*Total: ${gs(comp.t)}*\nSaldo actual: ${gs(c.saldo)}\nConfirmado con ${comp.conf}.\nSi algo no coincide, avisá para realizar una verificación.`
    :`*Mercator · Comprobante de pago*\nCliente: ${c.nombre}\nFecha: ${f}\nRecibimos: *${gs(comp.t)}*\nSaldo actual: ${gs(c.saldo)}\nConfirmado con ${comp.conf}.`;

function sigInit(){
  const c=$('#sg'),x=c.getContext('2d');if(!x)return;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.lineWidth=4;x.lineCap='round';x.strokeStyle='#000';
  let d=false,m=false;
  const p=e=>{const r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[(t.clientX-r.left)*c.width/r.width,(t.clientY-r.top)*c.height/r.height]};
  const s=e=>{e.preventDefault();d=true;const[a,b]=p(e);x.beginPath();x.moveTo(a,b)},mv=e=>{if(!d)return;e.preventDefault();const[a,b]=p(e);x.lineTo(a,b);x.stroke();m=true},en=()=>{d=false};
  ['mousedown','touchstart'].forEach(v=>c.addEventListener(v,s,{passive:false}));
  ['mousemove','touchmove'].forEach(v=>c.addEventListener(v,mv,{passive:false}));
  ['mouseup','mouseleave','touchend'].forEach(v=>c.addEventListener(v,en));
  window.sigOk=()=>m?confirmar({firma:c.toDataURL('image/png')}):alert('Falta la firma');
}

boleta:()=>`${hd('Boleta del POS','medio')}<p>${MN[pend.body.medio]} · <b>${gs(pend.tipo==='venta'?cartT():pend.body.monto)}</b></p><p class=mut>Escribí el número de la boleta que imprimió el POS.</p><input id=bo type=text inputmode=numeric autocomplete=off placeholder="Nº de boleta"><button class="b ok" onclick="boletaOk()">Continuar</button>`,
client:()=>`${hd('¿A quién se fía?','how')}${buscador()}<div id=cl>${cliHTML(S.cli,'elegirCliente')}</div><div class=sec>Cliente nuevo</div><input id=nc placeholder="Nombre"><input id=ne placeholder="Empresa (opcional)"><input id=np type=tel placeholder="Teléfono (opcional)"><button class="b ghost" onclick="nuevoCliente()">Agregar y fiar</button>`,
firma:()=>`${hd('Firma del cliente',pend&&pend.tipo==='pago'?'debt':'client')}${err?`<p class=er>${err}</p>`:''}<p class=mut>${sel.nombre}, firmá con el dedo.${offConf?' (Sin conexión: se confirma con firma.)':''}</p><canvas id=sg width=600 height=260></canvas><button class="b ok" onclick="sigOk()">Confirmar</button><button class="b ghost" onclick="go('firma')">Borrar firma</button>${!offConf&&navigator.onLine?(sel.tiene_pin?`<button class="b ghost" onclick="usarPin()">Usar el PIN del cliente</button>`:`<button class="b ghost" onclick="crearPin()">Crear un PIN para el cliente</button>`):''}`,
ok:()=>`<div class=full><div>✓</div><h1>Registrado</h1><p>${msg}</p>${comp?`<button class=b style="background:#fff;color:var(--ok);max-width:360px" onclick="enviarWA()">Enviar comprobante por WhatsApp</button><button class="b ghost" style="color:#fff;border-color:#fff;max-width:360px" onclick="comp=null;go('home')">Listo</button>`:''}</div>`,
debts:()=>S.cli.some(c=>c.saldo>0)?`${hd('Cobrar deuda','home')}${buscador()}<div id=cl>${cliHTML(S.cli.filter(c=>c.saldo>0),'elegirDeuda')}</div>`:`${hd('Cobrar deuda','home')}<p>Nadie debe nada 🎉</p>`,
debt:()=>`${hd(sel.nombre,'debts')}<p>Debe <b>${gs(sel.saldo)}</b></p><button class="b ok" onclick="pagar(${sel.saldo})">Pagó todo</button>${mi('pa',0,'Pago parcial')}<button class="b ghost" onclick="const m=monto('#pa');if(m>0&&m<=sel.saldo)pagar(m)">Registrar pago parcial</button>`,
gasto:()=>`${hd('Gasto de caja','home')}<p class=mut>Anotá lo que se pagó con plata de la caja.</p><input id=gc placeholder="¿En qué se gastó? (ej: hielo)">${mi('gm',0,'Monto')}<p id=ge class=er></p><button class="b ok" onclick="gastoOk()">Registrar gasto</button>`,
stock:()=>`${hd('Stock','home')}${S.stk.map(i=>`<div class=row style="cursor:default"><span class=dot style="background:var(${i.stock<=0?'--bad':i.stock<=i.minimo?'--cr':'--ok'})"></span><div>${i.nombre}</div><b>${i.stock}</b></div>`).join('')}`,
c1:()=>{const t=DEN.reduce((s,d)=>s+d*(cash[d]||0),0);return `${hd('Cerrar caja: efectivo','home')}<p>Contá billetes y monedas.</p>${DEN.map(d=>`<div class=row style="cursor:default"><div>${gs(d)}</div><div class=st><button onclick="cc(${d},-1)">−</button><input class=qi id=q${d} type=text inputmode=numeric value="${cash[d]||0}" onfocus="this.select()" oninput="ccs(${d},this.value)" onblur="this.value=cash[${d}]||0"><button onclick="cc(${d},1)">+</button></div></div>`).join('')}<div class=bar><div><small>Contado</small><strong id=ct>${gs(t)}</strong></div><button class=b onclick="go('cp')">Seguir</button></div>`},
cp:()=>`${hd('Cerrar caja: POS','c1')}<p>Cierre de lote del POS: escribí el total que imprimió el POS. Si no hubo cobros con POS, dejá 0.</p><p class=mut>POS Débito</p>${mi('ld',lote.d)}<p class=mut>POS Crédito</p>${mi('lc',lote.c)}<button class=b onclick="lote.d=monto('#ld');lote.c=monto('#lc');go('c2')">Seguir</button>`,
c2:()=>`${hd('Cerrar caja: mercadería','cp')}<p>Contá lo que queda.</p>${S.stk.map(i=>`<div class=row style="cursor:default"><div>${i.nombre}</div><div class=st><button onclick="ci(${i.id},-${pasoDe(i)})">−</button><input class=qi id=i${i.id} type=text inputmode="${pasoDe(i)%1?'decimal':'numeric'}" value="${cnt[i.id]||0}" onfocus="this.select()" oninput="cis(${i.id},this.value)" onblur="this.value=cnt[${i.id}]||0"><button onclick="ci(${i.id},${pasoDe(i)})">+</button></div></div>`).join('')}<div class=bar><div></div><button class="b ok" onclick="cerrar()">Revisar cierre</button></div>`,
c3:()=>`<h1>Revisá el cierre</h1><p class=er>Hay diferencias. Si contaste mal, corregí antes de terminar.</p>${resHTML()}<button class=b onclick="go('c1')">Corregir efectivo</button><button class=b onclick="go('cp')">Corregir POS</button><button class=b onclick="go('c2')">Corregir mercadería</button><button class="b bad" onclick="if(confirm('¿Cerrar la caja con estas diferencias?'))confirmarCierre()">Confirmar cierre así</button>`,
c4:()=>`<h1>Resultado del cierre</h1>${resHTML()}<button class="b ok" onclick="salir()">Terminar</button>`,
prob:()=>`${hd('Sin registrar','home')}<p class=mut>Estas operaciones no se pudieron registrar. Avisale al administrador.</p>${S.prob.map(p=>`<div class=row style="display:block;cursor:default"><b>${p.tipo==='venta'?'Venta':p.tipo==='pago'?'Cobro':p.tipo==='compra'?'Compra':'Gasto'}</b> · ${new Date(p.fecha).toLocaleString('es-PY')}<div class=er>${p.error}</div></div>`).join('')}<button class=b onclick="S.prob=[];save();go('home')">Entendido</button>`
};
function R(){
  $('#app').innerHTML=(W[V]||W.boot)();
  if(V==='firma')sigInit();
  est();window.scrollTo(0,0);
}
function boot(){
  if(!base())return go('setup');
  if(S.token&&S.user&&S.turno&&!S.exp){go('home');sync();return}
  loadUsers();
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script></body></html>
