<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<title>Cantina</title>
<style>
:root{--bg:#F4F1EA;--card:#FDFCF9;--ink:#2C2C2A;--mut:#5F5E5A;--soft:#8F8A7C;--line:#E8E4D9;--line2:#ECE7DB;--pri:#2C2C2A;--ok:#2F8F5B;--okbg:#EAF3DE;--okink:#27500A;--cr:#993C1D;--crbg:#FAECE7;--crink:#712B13;--bad:#C94F4F;--pur:#534AB7;--ambbg:#FFF4DD;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 18px/1.35 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:600px;margin:0 auto;padding:12px 16px calc(120px + env(safe-area-inset-bottom,0px))}
#est{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
.est{max-width:600px;margin:0 auto;padding:7px 16px;font-size:14px;font-weight:600;color:var(--okink);background:var(--okbg);text-align:center;border-bottom:1px solid var(--line)}
.est.wr{color:#7a5a10;background:var(--ambbg)}.est.bad{color:var(--crink);background:var(--crbg)}
h1{font-size:26px;font-weight:700;letter-spacing:-.3px;margin:8px 0 14px}small,.mut{color:var(--mut);font-weight:500;font-size:15px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.top h1{margin:0;font-size:22px;flex:1}
.b{display:block;width:100%;min-height:66px;border:0;border-radius:14px;font-family:inherit;font-weight:600;font-size:19px;color:#FDFCF9;background:var(--pri);margin:0 0 12px;cursor:pointer}
.b:disabled{opacity:.35}.b.ok{background:var(--ok)}.b.cr{background:var(--cr)}.b.bad{background:var(--bad)}.b.gy{background:var(--pur)}
.b.ghost{background:transparent;color:var(--ink);border:1px solid #D8D3C5;min-height:52px;font-size:17px}
.back{border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-weight:600;font-size:16px;border-radius:12px;min-height:46px;padding:0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.tile b{font-weight:600}.tile.on{border-color:var(--ok);background:var(--okbg)}.tile span{color:var(--mut);font-size:16px}
.q{position:absolute;top:8px;right:10px;background:var(--ok);color:#fff;border-radius:10px;min-width:28px;text-align:center;font-style:normal;font-weight:600;padding:2px 8px}
.m{position:absolute;bottom:8px;right:8px;width:44px;height:44px;border-radius:12px;border:0;background:var(--line2);color:var(--ink);font-family:inherit;font-size:24px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;align-items:center;max-width:600px;margin:0 auto}
.bar>div{flex:1}.bar strong{display:block;font-size:24px;font-weight:700}.bar .b{margin:0;flex:1}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px;min-height:62px;cursor:pointer}
.row>div{flex:1}.dot{width:14px;height:14px;border-radius:50%;flex:none}
.st{display:flex;align-items:center;gap:8px}.st button{width:50px;height:50px;border-radius:12px;border:0;background:var(--line2);color:var(--ink);font-family:inherit;font-size:26px}.st b{min-width:44px;text-align:center;font-size:21px;font-weight:700}
input{width:100%;min-height:58px;border-radius:12px;border:1px solid #D8D3C5;background:var(--card);color:var(--ink);font-family:inherit;font-weight:500;font-size:20px;padding:0 14px;margin-bottom:12px}
input:focus{outline:2px solid var(--ok);border-color:var(--ok)}
.full{position:fixed;inset:0;background:var(--ok);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}.full div{font-size:90px}
.er{color:var(--crink);background:var(--crbg);border-radius:10px;padding:8px 12px;font-size:16px;font-weight:600}.er:empty{display:none}
.dots{font-size:32px;text-align:center;min-height:56px;letter-spacing:8px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.kp button{min-height:70px;font-family:inherit;font-weight:600;font-size:26px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
canvas{width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;touch-action:none;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:16px}td,th{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line2)}th{color:var(--mut);font-weight:600;font-size:14px}td:first-child,th:first-child{text-align:left}
.pos{color:var(--okink)}.neg{color:var(--bad)}
.qi{width:84px;min-height:50px;margin:0;padding:0 4px;text-align:center;font-weight:700;font-size:21px}
.mi{position:relative}.mi span{position:absolute;right:16px;top:15px;font-size:19px;color:var(--soft)}.mi input{padding-right:56px}
@media(min-width:700px){#app,.est,.bar{max-width:880px}.grid{grid-template-columns:repeat(3,1fr)}.b{font-size:18px}}
@media(min-width:1100px){#app,.est,.bar{max-width:1000px}.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div id="est"></div><div id="app"></div>
<script src="config.js"></script>
<script>
const DEN=[100000,50000,20000,10000,5000,2000,1000,500,100];
let S={};try{S=JSON.parse(localStorage.getItem('cantina2'))||{}}catch(e){}
for(const k of ['q','prob','ult','cat','cli','stk'])S[k]=S[k]||[];
const save=()=>{try{localStorage.setItem('cantina2',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),fm=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.'),gs=n=>fm(n)+' Gs';
const monto=q=>parseInt(($(q).value||'').replace(/\D/g,''),10)||0;
const fmtMi=el=>{const n=el.value.replace(/\D/g,'');el.value=n?fm(Number(n)):''};
const mi=(id,v,ph)=>`<div class=mi><input id=${id} type=tel inputmode=numeric placeholder="${ph||'0'}" value="${v?fm(v):''}" oninput="fmtMi(this)"><span>Gs</span></div>`;
const uid=()=>(window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,12));
const base=()=>String(window.CANTINA_API||S.api||'').replace(/\/$/,'');
let V='boot',cart={},sel=null,cash={},cnt={},pin='',err='',msg='',cb=null,res=null,usr=[],pend=null,offConf=false,ptitle='',pback='users',psign=false,backTo='home',syncing=false,comp=null,pin1='';

async function api(path,opt={},ms=70000){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{
    const r=await fetch(base()+path,{...opt,signal:c.signal,headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{}),...(opt.headers||{})}});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){const x=d.detail,e=new Error(typeof x==='string'?x:(x&&x.mensaje)||'Error ('+r.status+')');e.status=r.status;throw e}
    return d;
  }catch(e){if(!e.status){e.net=true;e.message='Sin conexión con el servidor'}throw e}finally{clearTimeout(t)}
}
const go=v=>{V=v;R()};
const hd=(t,b)=>`<div class=top>${b?`<button class=back onclick="go('${b}')">← Volver</button>`:''}<h1>${t}</h1></div>`;
const cartT=()=>Object.entries(cart).reduce((s,[k,q])=>s+q*S.cat.find(p=>p.id==k).precio,0);
const lineas=()=>Object.entries(cart).filter(([k,q])=>q>0).map(([k,q])=>({producto_id:+k,cantidad:q}));

/* ---------- estado y sincronización ---------- */
function est(){
  const n=S.q.length,p=S.prob.length,el=$('#est');
  if(!S.user){el.innerHTML='';return}
  el.innerHTML=S.exp?`<div class="est bad" onclick="loadUsers()">🔑 Sesión vencida · tocá para entrar</div>`
   :p?`<div class="est bad" onclick="go('prob')">⚠ ${p} sin registrar · tocá para ver</div>`
   :n?`<div class="est wr">🟡 ${n} por enviar${navigator.onLine?'':' · sin conexión'}</div>`
   :navigator.onLine?`<div class=est>🟢 Todo guardado</div>`:`<div class="est wr">🔴 Sin conexión</div>`;
}
async function sync(){
  if(syncing||!S.token)return;syncing=true;
  try{
    while(S.q.length){
      const op=S.q[0];
      try{
        const r=await api(op.path,{method:'POST',body:JSON.stringify(op.body)},30000);
        if(op.tipo==='venta'){S.ult.push({uuid:op.body.client_uuid,id:r.id});S.ult=S.ult.slice(-20)}
        S.q.shift();
      }catch(e){
        if(e.net)break;
        if(e.status===401&&!/PIN/.test(e.message)){S.exp=true;break}
        S.prob.push({tipo:op.tipo,error:e.message,fecha:Date.now()});S.q.shift();
      }
      save();est();
    }
    if(!S.q.length)await refrescar();
  }finally{syncing=false;save();est()}
}
async function refrescar(){
  try{
    S.turno=await api('/api/turnos/actual');
    if(!S.q.length){const[c,s,cl]=await Promise.all([api('/api/catalogo'),api('/api/stock'),api('/api/clientes')]);S.cat=c;S.stk=s;S.cli=cl}
    save();return true;
  }catch(e){if(e.status===401&&!S.q.length)S.exp=true;return false}
}
window.addEventListener('online',()=>{sync()});window.addEventListener('offline',est);
setInterval(()=>{if(S.q.length&&navigator.onLine)sync()},30000);

/* ---------- acceso ---------- */
async function loadUsers(){
  msg='Conectando con el servidor… la primera vez del día puede tardar hasta un minuto';go('wait');
  try{usr=await api('/api/usuarios/publico');go('users')}catch(e){msg=e.message;go('fail')}
}
function pinScr(t,back,fn,sign){ptitle=t;pback=back;cb=fn;psign=!!sign;pin='';go('pin')}
function key(k){
  if(k==='⌫')pin=pin.slice(0,-1);
  else if(k==='✓'){if(pin.length>=4){const p=pin;pin='';err='';cb(p)}return}
  else if(pin.length<8)pin+=k;
  R();
}
function pickUser(i){sel=usr[i];err='';pinScr('PIN de '+sel.nombre,'users',doLogin)}
async function doLogin(p){
  msg='Entrando…';go('wait');
  try{
    const r=await api('/api/login',{method:'POST',body:JSON.stringify({usuario_id:sel.id,pin:p})});
    S.token=r.token;S.user=r.usuario;S.exp=false;save();await refrescar();entrar();
  }catch(e){err=e.message;pinScr('PIN de '+sel.nombre,'users',doLogin)}
}
function entrar(){
  if(S.q.length)sync();
  if(!S.turno)return go('fondo');
  if(S.turno.user_id===S.user.id||S.user.rol==='admin')go('home');else go('otro');
}
async function abrirTurno(){
  const fondo=monto('#f');msg='Abriendo turno…';go('wait');
  try{await api('/api/turnos/abrir',{method:'POST',body:JSON.stringify({fondo})});await refrescar();go('home')}catch(e){msg=e.message;backTo='fondo';go('err')}
}
function salir(){S.token=null;S.user=null;S.exp=false;save();loadUsers()}

/* ---------- ventas y cobros ---------- */
function add(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);R()}
function fx(b,s){
  if(b.lineas){
    let t=0;
    b.lineas.forEach(l=>{const p=S.cat.find(x=>x.id==l.producto_id);if(!p)return;t+=p.precio*l.cantidad;
      p.receta.forEach(r=>{const i=S.stk.find(x=>x.id==r.item_id);if(i)i.stock=Math.round((i.stock-s*r.cantidad*l.cantidad)*1000)/1000})});
    if(b.tipo==='credito'){const c=S.cli.find(x=>x.id==b.cliente_id);if(c)c.saldo+=s*t}
  }else{const c=S.cli.find(x=>x.id==b.cliente_id);if(c)c.saldo-=s*b.monto}
}
function vender(t){
  pend={tipo:'venta',body:{tipo:t,lineas:lineas()}};
  if(t==='contado')go('medio');else go('client');
}
async function elegirCliente(id){sel=S.cli.find(c=>c.id===id);pend.body.cliente_id=id;await irConf()}
async function nuevoCliente(){
  const n=$('#nc').value.trim(),tel=$('#np').value.trim();if(n.length<2)return;
  try{const r=await api('/api/clientes',{method:'POST',body:JSON.stringify({nombre:n,telefono:tel||null})});S.cli.push({id:r.id,nombre:n,telefono:tel,saldo:0,tiene_pin:false});save();await elegirCliente(r.id)}
  catch(e){msg=e.net?'Para agregar un cliente nuevo hace falta conexión':e.message;backTo='client';go('err')}
}
async function irConf(){
  if(S.q.length){msg='Enviando operaciones pendientes…';go('wait');await sync()}
  offConf=S.q.length>0||!navigator.onLine;err='';
  if(sel.tiene_pin&&!offConf)pinScr(sel.nombre+', ingresá tu PIN','client',p=>confirmar({cliente_pin:p}),true);else go('firma');
}
async function confirmar(extra){
  const op={tipo:pend.tipo,path:pend.tipo==='venta'?'/api/ventas':'/api/pagos',body:{...pend.body,...extra,client_uuid:uid()}};
  if(!offConf&&!S.q.length){
    try{msg='Registrando…';go('wait');const r=await api(op.path,{method:'POST',body:JSON.stringify(op.body)});return fin(op,r)}
    catch(e){
      if(!e.net){
        if(e.status===401&&!/PIN/.test(e.message)){S.exp=true;est();msg='La sesión venció. Entrá de nuevo; no se perdió nada.';backTo='home';return go('err')}
        if(/PIN/.test(e.message)){err=e.message;return pinScr(sel.nombre+', ingresá tu PIN','client',p=>confirmar({cliente_pin:p}),true)}
        msg=e.message;backTo='home';return go('err');
      }
      if(extra.cliente_pin){offConf=true;err='Se cortó la conexión: pedí que firme';return go('firma')}
    }
  }
  S.q.push(op);fin(op,null);
}
function fin(op,r){
  fx(op.body,1);
  const b=op.body,t=op.tipo==='venta'?b.lineas.reduce((s,l)=>s+l.cantidad*S.cat.find(p=>p.id==l.producto_id).precio,0):b.monto;
  if(op.tipo==='venta'){S.last={uuid:b.client_uuid,tipo:'venta',fx:{lineas:b.lineas,tipo:b.tipo,cliente_id:b.cliente_id}};if(r){S.ult.push({uuid:b.client_uuid,id:r.id});S.ult=S.ult.slice(-20)}}
  else S.last=null;
  msg=`${gs(t)} ${op.tipo==='pago'?'cobrado':b.tipo==='contado'?'al contado':'a crédito'}${b.medio&&b.medio!=='efectivo'?' · '+MN[b.medio]:''}${r?'':' · se enviará al volver internet'}`;
  comp=b.cliente_id?{tipo:op.tipo,cid:b.cliente_id,t,conf:b.cliente_pin?'PIN':'firma',fecha:Date.now(),
    lin:op.tipo==='venta'?b.lineas.map(l=>{const p=S.cat.find(x=>x.id==l.producto_id);return `${l.cantidad} × ${p.nombre} × ${fm(p.precio)}`}):[]}:null;
  cart={};save();go('ok');if(!comp)setTimeout(()=>{if(V==='ok')go('home')},1400);
  if(r)refrescar().then(est);else sync();
}
async function undo(){
  const L=S.last;if(!L)return;
  const i=S.q.findIndex(o=>o.body.client_uuid===L.uuid);
  if(i>=0)S.q.splice(i,1);
  else{
    const u=S.ult.find(x=>x.uuid===L.uuid);if(!u)return;
    try{await api(`/api/ventas/${u.id}/anular`,{method:'POST',body:JSON.stringify({motivo:'Corrección de la empleada'})})}catch(e){msg=e.message;backTo='home';return go('err')}
  }
  fx(L.fx,-1);S.last=null;save();go('home');
}
function pagar(m){pend={tipo:'pago',body:{cliente_id:sel.id,monto:m}};go('medio')}
const MEDIOS=[['efectivo','💵 Efectivo','ok'],['pos_debito','💳 POS Débito',''],['pos_credito','💳 POS Crédito',''],['transferencia','🏦 Transferencia','gy']];
const MN=Object.fromEntries(MEDIOS.map(x=>[x[0],x[1].slice(3)]));
function medioPago(k){pend.body.medio=k;if(pend.tipo==='venta'){offConf=!navigator.onLine;confirmar({})}else irConf()}
function usarPin(){err='';pinScr(sel.nombre+', ingresá tu PIN','client',p=>confirmar({cliente_pin:p}),true)}
function crearPin(m){err=m||'';pinScr(sel.nombre+', elegí un PIN de 4 a 8 números (que lo escriba el cliente)','client',p=>{pin1=p;pinScr('Repetí el PIN','client',guardarPin)})}
async function guardarPin(p){
  if(p!==pin1)return crearPin('Los PIN no coinciden, probá de nuevo');
  msg='Guardando PIN…';go('wait');
  try{await api(`/api/clientes/${sel.id}/pin`,{method:'PUT',body:JSON.stringify({pin:p})});sel.tiene_pin=true;save();usarPin()}
  catch(e){msg=e.message;backTo='client';go('err')}
}
function enviarWA(){
  const c=S.cli.find(x=>x.id===comp.cid),f=new Date(comp.fecha).toLocaleString('es-PY');
  const txt=comp.tipo==='venta'
    ?`*Cantina · Compra a crédito*\nCliente: ${c.nombre}\nFecha: ${f}\n${comp.lin.join('\n')}\n*Total: ${gs(comp.t)}*\nSaldo actual: ${gs(c.saldo)}\nConfirmado con ${comp.conf}.\nSi algo no coincide, avisá para realizar una verificación.`
    :`*Cantina · Comprobante de pago*\nCliente: ${c.nombre}\nFecha: ${f}\nRecibimos: *${gs(comp.t)}*\nSaldo actual: ${gs(c.saldo)}\nConfirmado con ${comp.conf}.`;
  let n=String(c.telefono||'').replace(/\D/g,'');if(n.startsWith('0'))n='595'+n.slice(1);
  window.open(`https://wa.me/${n}?text=${encodeURIComponent(txt)}`,'_blank');
}
async function gastoOk(){
  const concepto=$('#gc').value.trim(),m=monto('#gm');
  if(concepto.length<3||m<=0){$('#ge').textContent='Escribí en qué se gastó y el monto';return}
  const op={tipo:'gasto',path:'/api/gastos',body:{client_uuid:uid(),monto:m,concepto}};
  if(navigator.onLine&&!S.q.length){
    try{msg='Registrando…';go('wait');const r=await api(op.path,{method:'POST',body:JSON.stringify(op.body)});return finG(op,r)}
    catch(e){if(!e.net){msg=e.message;backTo='gasto';return go('err')}}
  }
  S.q.push(op);finG(op,null);
}
function finG(op,r){
  comp=null;S.last=null;msg=`Gasto de ${gs(op.body.monto)} registrado`+(r?'':' · se enviará al volver internet');
  save();go('ok');setTimeout(()=>{if(V==='ok')go('home')},1400);if(r)refrescar().then(est);else sync();
}
function sigInit(){
  const c=$('#sg'),x=c.getContext('2d');if(!x)return;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.lineWidth=4;x.lineCap='round';x.strokeStyle='#000';
  let d=false,m=false;
  const p=e=>{const r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[(t.clientX-r.left)*c.width/r.width,(t.clientY-r.top)*c.height/r.height]};
  const s=e=>{e.preventDefault();d=true;const[a,b]=p(e);x.beginPath();x.moveTo(a,b)},mv=e=>{if(!d)return;e.preventDefault();const[a,b]=p(e);x.lineTo(a,b);x.stroke();m=true},en=()=>{d=false};
  ['mousedown','touchstart'].forEach(v=>c.addEventListener(v,s,{passive:false}));
  ['mousemove','touchmove'].forEach(v=>c.addEventListener(v,mv,{passive:false}));
  ['mouseup','mouseleave','touchend'].forEach(v=>c.addEventListener(v,en));
  window.sigOk=()=>m?confirmar({firma:c.toDataURL('image/png')}):alert('Falta la firma');
}

/* ---------- cierre de caja ---------- */
const tot=()=>DEN.reduce((s,d)=>s+d*(cash[d]||0),0);
const updTot=()=>{const e=$('#ct');if(e)e.textContent=gs(tot())};
/* los botones y el teclado actualizan solo el campo y el total: no se redibuja la pantalla, así no salta hacia arriba */
const cc=(d,n)=>{cash[d]=Math.max(0,(cash[d]||0)+n);$('#q'+d).value=cash[d];updTot()};
const ccs=(d,v)=>{cash[d]=Math.max(0,parseInt(String(v).replace(/\D/g,''),10)||0);updTot()};
const ci=(id,n)=>{cnt[id]=Math.max(0,Math.round(((cnt[id]||0)+n)*1000)/1000);$('#i'+id).value=cnt[id]};
const cis=(id,v)=>{const x=parseFloat(String(v).replace(',','.'));cnt[id]=isFinite(x)&&x>0?Math.round(x*1000)/1000:0};
const pasoDe=i=>i.paso||1;
const cuerpoCierre=()=>({efectivo_contado:tot(),conteo:S.stk.map(i=>({item_id:i.id,contado:cnt[i.id]||0}))});
async function cerrar(){
  msg='Calculando cierre…';go('wait');await sync();
  if(S.q.length){msg='Hay operaciones sin enviar. Conectate a internet y probá de nuevo.';backTo='c2';return go('err')}
  try{
    res=await api(`/api/turnos/${S.turno.id}/cerrar`,{method:'POST',body:JSON.stringify({...cuerpoCierre(),solo_calcular:true})});
    if(res.diferencia!==0||res.items.some(i=>i.diferencia!==0))go('c3');else await confirmarCierre();
  }catch(e){msg=e.message;backTo='c2';go('err')}
}
async function confirmarCierre(){
  msg='Cerrando caja…';go('wait');
  try{
    res=await api(`/api/turnos/${S.turno.id}/cerrar`,{method:'POST',body:JSON.stringify(cuerpoCierre())});
    S.turno=null;S.last=null;S.ult=[];save();go('c4');
  }catch(e){msg=e.message;backTo='c2';go('err')}
}

/* ---------- pantallas ---------- */
const resHTML=()=>`<div class=row style="display:block;cursor:default"><table><tr><td>Fondo inicial</td><td>${gs(res.fondo)}</td></tr><tr><td>Ventas contado (efectivo)</td><td>${gs(res.ventas_contado)}</td></tr><tr><td>Cobros de deudas (efectivo)</td><td>${gs(res.cobros)}</td></tr><tr><td>Gastos de caja</td><td>−${gs(res.gastos||0)}</td></tr><tr><td><b>Debería haber</b></td><td><b>${gs(res.esperado)}</b></td></tr><tr><td>Contaste</td><td>${gs(res.contado)}</td></tr><tr><td><b>Diferencia</b></td><td class="${res.diferencia<0?'neg':'pos'}"><b>${res.diferencia>0?'+':''}${gs(res.diferencia)}</b></td></tr></table></div>${Object.keys(res.otros_medios||{}).length?`<div class=row style="display:block;cursor:default"><small>Cobrado por otros medios (no está en la caja)</small><table>${Object.entries(res.otros_medios).map(([k,v])=>`<tr><td>${MN[k]||k}</td><td>${gs(v)}</td></tr>`).join('')}</table></div>`:''}<div class=row style="display:block;cursor:default"><table><tr><th>Mercadería</th><th>Debe haber</th><th>Contaste</th></tr>${res.items.map(i=>`<tr><td>${i.nombre}</td><td>${i.esperado}</td><td class="${i.diferencia<0?'neg':i.diferencia>0?'pos':''}">${i.contado}</td></tr>`).join('')}</table></div>`;
const W={
boot:()=>'',
wait:()=>`<h1>Un momento…</h1><p class=mut>${msg}</p>`,
err:()=>`<h1>Atención</h1><p class=er>${msg}</p><button class=b onclick="go('${backTo}')">Volver</button>`,
fail:()=>`<h1>No hay conexión</h1><p class=er>${msg}</p><button class=b onclick="loadUsers()">Reintentar</button>${S.token&&S.turno?`<button class="b ghost" onclick="go('home')">Seguir trabajando sin conexión</button>`:''}`,
setup:()=>`<h1>Primera vez</h1><p class=mut>Escribí la dirección del servidor (te la da el administrador).</p><input id=u placeholder="https://cantina-api….onrender.com"><button class="b ok" onclick="const v=$('#u').value.trim();if(/^https?:\\/\\//.test(v)){S.api=v;save();loadUsers()}">Guardar</button>`,
users:()=>`<h1>¿Quién atiende?</h1>${usr.map((u,i)=>`<button class=b onclick="pickUser(${i})">${u.nombre}</button>`).join('')}`,
pin:()=>`${hd(ptitle,pback)}${err?`<p class=er>${err}</p>`:''}<div class=dots>${'●'.repeat(pin.length)||'&nbsp;'}</div><div class=kp>${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button onclick="key('${k}')">${k}</button>`).join('')}</div>${psign?`<button class="b ghost" onclick="go('firma')">Prefiere firmar</button>`:''}`,
fondo:()=>`<h1>Empezar turno</h1><p>${S.user.nombre}, ¿con cuánto efectivo empezás?</p>${mi('f',100000)}<button class="b ok" onclick="abrirTurno()">Empezar turno</button><button class="b ghost" onclick="salir()">Cambiar de usuario</button>`,
otro:()=>`<h1>Turno abierto</h1><p>Hay un turno abierto de <b>${S.turno.empleada}</b>. Tiene que cerrar su caja antes de que vos empieces.</p><button class=b onclick="salir()">Volver</button>`,
home:()=>`<h1>Hola, ${S.user.nombre}</h1><button class="b ok" onclick="cart={};go('sell')">🛒 Vender</button><button class="b cr" onclick="go('debts')">💰 Cobrar deuda</button><button class="b gy" onclick="go('gasto')">🧾 Cargar gasto</button><button class=b onclick="go('stock')">📦 Stock</button><button class="b bad" onclick="cash={};cnt={};go('c1')">🔴 Cerrar caja</button>${S.last?`<button class="b ghost" onclick="undo()">Deshacer última venta</button>`:''}`,
sell:()=>`${hd('Vender','home')}<div class=grid>${S.cat.map(p=>{const q=cart[p.id]||0;return `<div class="tile ${q?'on':''}" onclick="add(${p.id},1)"><b>${p.nombre}</b><span>${gs(p.precio)}</span>${q?`<i class=q>${q}</i><button class=m onclick="event.stopPropagation();add(${p.id},-1)">−</button>`:''}</div>`}).join('')}</div><div class=bar><div><small>Total</small><strong>${gs(cartT())}</strong></div><button class=b ${cartT()?'':'disabled'} onclick="go('how')">Cobrar</button></div>`,
how:()=>`${hd('¿Cómo paga?','sell')}<p>Total: <b>${gs(cartT())}</b></p><button class="b ok" onclick="vender('contado')">Contado</button><button class="b cr" onclick="vender('credito')">Crédito</button>`,
medio:()=>`${hd('¿Con qué paga?',pend.tipo==='venta'?'how':'debt')}<p>Total: <b>${gs(pend.tipo==='venta'?cartT():pend.body.monto)}</b></p>${MEDIOS.map(x=>`<button class="b ${x[2]}" onclick="medioPago('${x[0]}')">${x[1]}</button>`).join('')}`,
client:()=>`${hd('¿A quién se fía?','how')}${S.cli.map(c=>`<div class=row onclick="elegirCliente(${c.id})"><div>${c.nombre}</div><small>debe ${gs(c.saldo)}</small></div>`).join('')}<input id=nc placeholder="Cliente nuevo: nombre"><input id=np type=tel placeholder="Teléfono (opcional)"><button class="b ghost" onclick="nuevoCliente()">Agregar y fiar</button>`,
firma:()=>`${hd('Firma del cliente',pend&&pend.tipo==='pago'?'debt':'client')}${err?`<p class=er>${err}</p>`:''}<p class=mut>${sel.nombre}, firmá con el dedo.${offConf?' (Sin conexión: se confirma con firma.)':''}</p><canvas id=sg width=600 height=260></canvas><button class="b ok" onclick="sigOk()">Confirmar</button><button class="b ghost" onclick="go('firma')">Borrar firma</button>${!offConf&&navigator.onLine?(sel.tiene_pin?`<button class="b ghost" onclick="usarPin()">Usar el PIN del cliente</button>`:`<button class="b ghost" onclick="crearPin()">Crear un PIN para el cliente</button>`):''}`,
ok:()=>`<div class=full><div>✓</div><h1>Registrado</h1><p>${msg}</p>${comp?`<button class=b style="background:#fff;color:var(--ok);max-width:360px" onclick="enviarWA()">Enviar comprobante por WhatsApp</button><button class="b ghost" style="color:#fff;border-color:#fff;max-width:360px" onclick="comp=null;go('home')">Listo</button>`:''}</div>`,
debts:()=>{const l=S.cli.filter(c=>c.saldo>0);return `${hd('Cobrar deuda','home')}${l.map(c=>`<div class=row onclick="sel=S.cli.find(x=>x.id===${c.id});go('debt')"><div>${c.nombre}</div><b>${gs(c.saldo)}</b></div>`).join('')||'<p>Nadie debe nada 🎉</p>'}`},
debt:()=>`${hd(sel.nombre,'debts')}<p>Debe <b>${gs(sel.saldo)}</b></p><button class="b ok" onclick="pagar(${sel.saldo})">Pagó todo</button>${mi('pa',0,'Pago parcial')}<button class="b ghost" onclick="const m=monto('#pa');if(m>0&&m<=sel.saldo)pagar(m)">Registrar pago parcial</button>`,
gasto:()=>`${hd('Gasto de caja','home')}<p class=mut>Anotá lo que se pagó con plata de la caja.</p><input id=gc placeholder="¿En qué se gastó? (ej: hielo)">${mi('gm',0,'Monto')}<p id=ge class=er></p><button class="b ok" onclick="gastoOk()">Registrar gasto</button>`,
stock:()=>`${hd('Stock','home')}${S.stk.map(i=>`<div class=row style="cursor:default"><span class=dot style="background:var(${i.stock<=0?'--bad':i.stock<=i.minimo?'--cr':'--ok'})"></span><div>${i.nombre}</div><b>${i.stock}</b></div>`).join('')}`,
c1:()=>{const t=DEN.reduce((s,d)=>s+d*(cash[d]||0),0);return `${hd('Cerrar caja: efectivo','home')}<p>Contá billetes y monedas.</p>${DEN.map(d=>`<div class=row style="cursor:default"><div>${gs(d)}</div><div class=st><button onclick="cc(${d},-1)">−</button><input class=qi id=q${d} type=text inputmode=numeric value="${cash[d]||0}" onfocus="this.select()" oninput="ccs(${d},this.value)" onblur="this.value=cash[${d}]||0"><button onclick="cc(${d},1)">+</button></div></div>`).join('')}<div class=bar><div><small>Contado</small><strong id=ct>${gs(t)}</strong></div><button class=b onclick="go('c2')">Seguir</button></div>`},
c2:()=>`${hd('Cerrar caja: mercadería','c1')}<p>Contá lo que queda.</p>${S.stk.map(i=>`<div class=row style="cursor:default"><div>${i.nombre}</div><div class=st><button onclick="ci(${i.id},-${pasoDe(i)})">−</button><input class=qi id=i${i.id} type=text inputmode="${pasoDe(i)%1?'decimal':'numeric'}" value="${cnt[i.id]||0}" onfocus="this.select()" oninput="cis(${i.id},this.value)" onblur="this.value=cnt[${i.id}]||0"><button onclick="ci(${i.id},${pasoDe(i)})">+</button></div></div>`).join('')}<div class=bar><div></div><button class="b bad" onclick="cerrar()">Revisar cierre</button></div>`,
c3:()=>`<h1>Revisá el cierre</h1><p class=er>Hay diferencias. Si contaste mal, corregí antes de terminar.</p>${resHTML()}<button class=b onclick="go('c1')">Corregir efectivo</button><button class=b onclick="go('c2')">Corregir mercadería</button><button class="b bad" onclick="if(confirm('¿Cerrar la caja con estas diferencias?'))confirmarCierre()">Confirmar cierre así</button>`,
c4:()=>`<h1>Resultado del cierre</h1>${resHTML()}<button class="b ok" onclick="salir()">Terminar</button>`,
prob:()=>`${hd('Sin registrar','home')}<p class=mut>Estas operaciones no se pudieron registrar. Avisale al administrador.</p>${S.prob.map(p=>`<div class=row style="display:block;cursor:default"><b>${p.tipo==='venta'?'Venta':p.tipo==='pago'?'Cobro':'Gasto'}</b> · ${new Date(p.fecha).toLocaleString('es-PY')}<div class=er>${p.error}</div></div>`).join('')}<button class=b onclick="S.prob=[];save();go('home')">Entendido</button>`
};
function R(){
  $('#app').innerHTML=(W[V]||W.boot)();
  if(V==='firma')sigInit();
  est();window.scrollTo(0,0);
}
function boot(){
  if(!base())return go('setup');
  if(S.token&&S.user&&S.turno&&!S.exp){go('home');sync();return}
  loadUsers();
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script></body></html>
