<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c52"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<title>Cantina</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f3;--card:#fff;--ink:#16302b;--mut:#5b6f69;--pri:#0f5c52;--ok:#1a8f4d;--cr:#d9701a;--bad:#c8372d;--line:#d5dfdb;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:800 20px/1.3 Nunito,system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:10px 14px calc(120px + env(safe-area-inset-bottom,0px))}
#est{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
.est{max-width:560px;margin:0 auto;padding:6px 14px;font-size:15px;color:#fff;background:var(--ok);text-align:center}
.est.wr{background:var(--cr)}.est.bad{background:var(--bad)}
h1{font-size:28px;margin:8px 0 14px}small,.mut{color:var(--mut);font-weight:600;font-size:16px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}.top h1{margin:0;font-size:24px;flex:1}
.b{display:block;width:100%;min-height:68px;border:0;border-radius:18px;font:inherit;font-size:22px;color:#fff;background:var(--pri);margin:0 0 12px;cursor:pointer}
.b:disabled{opacity:.35}.b.ok{background:var(--ok)}.b.cr{background:var(--cr)}.b.bad{background:var(--bad)}
.b.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);min-height:52px;font-size:18px}
.back{border:0;background:var(--card);color:var(--ink);font:inherit;font-size:18px;border-radius:14px;min-height:48px;padding:0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.tile.on{border-color:var(--ok)}.tile span{color:var(--mut);font-size:17px}
.q{position:absolute;top:8px;right:10px;background:var(--ok);color:#fff;border-radius:12px;min-width:30px;text-align:center;font-style:normal;padding:2px 8px}
.m{position:absolute;bottom:8px;right:8px;width:44px;height:44px;border-radius:12px;border:0;background:var(--line);color:var(--ink);font:inherit;font-size:24px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;align-items:center;max-width:560px;margin:0 auto}
.bar>div{flex:1}.bar strong{display:block;font-size:26px}.bar .b{margin:0;flex:1}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:8px;min-height:64px;cursor:pointer}
.row>div{flex:1}.dot{width:16px;height:16px;border-radius:50%;flex:none}
.st{display:flex;align-items:center;gap:8px}.st button{width:52px;height:52px;border-radius:14px;border:0;background:var(--line);color:var(--ink);font:inherit;font-size:28px}.st b{min-width:44px;text-align:center;font-size:22px}
input{width:100%;min-height:60px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:22px;padding:0 14px;margin-bottom:12px}
.full{position:fixed;inset:0;background:var(--ok);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}.full div{font-size:90px}
.er{color:var(--bad);font-size:18px}.dots{font-size:34px;text-align:center;min-height:56px;letter-spacing:8px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.kp button{min-height:72px;font:inherit;font-size:28px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink)}
canvas{width:100%;background:#fff;border:2px solid var(--line);border-radius:14px;touch-action:none;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:17px}td,th{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}td:first-child,th:first-child{text-align:left}
.pos{color:var(--ok)}.neg{color:var(--bad)}
</style></head><body><div id="est"></div><div id="app"></div>
<script src="config.js"></script>
<script>
const DEN=[100000,50000,20000,10000,5000,2000,1000,500,100];
let S={};try{S=JSON.parse(localStorage.getItem('cantina2'))||{}}catch(e){}
for(const k of ['q','prob','ult','cat','cli','stk'])S[k]=S[k]||[];
const save=()=>{try{localStorage.setItem('cantina2',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),gs=n=>Math.round(n).toLocaleString('es-PY')+' Gs';
const uid=()=>(window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,12));
const base=()=>String(window.CANTINA_API||S.api||'').replace(/\/$/,'');
let V='boot',cart={},sel=null,cash={},cnt={},pin='',err='',msg='',cb=null,res=null,usr=[],pend=null,offConf=false,ptitle='',pback='users',psign=false,backTo='home',syncing=false;

async function api(path,opt={},ms=70000){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{
    const r=await fetch(base()+path,{...opt,signal:c.signal,headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{}),...(opt.headers||{})}});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){const x=d.detail,e=new Error(typeof x==='string'?x:(x&&x.mensaje)||'Error ('+r.status+')');e.status=r.status;throw e}
    return d;
  }catch(e){if(!e.status){e.net=true;e.message='Sin conexión con el servidor'}throw e}finally{clearTimeout(t)}
}
const go=v=>{V=v;R()};
const hd=(t,b)=>`<div class=top>${b?`<button class=back onclick="go('${b}')">← Volver</button>`:''}<h1>${t}</h1></div>`;
const cartT=()=>Object.entries(cart).reduce((s,[k,q])=>s+q*S.cat.find(p=>p.id==k).precio,0);
const lineas=()=>Object.entries(cart).filter(([k,q])=>q>0).map(([k,q])=>({producto_id:+k,cantidad:q}));

/* ---------- estado y sincronización ---------- */
function est(){
  const n=S.q.length,p=S.prob.length,el=$('#est');
  if(!S.user){el.innerHTML='';return}
  el.innerHTML=S.exp?`<div class="est bad" onclick="loadUsers()">🔑 Sesión vencida · tocá para entrar</div>`
   :p?`<div class="est bad" onclick="go('prob')">⚠ ${p} sin registrar · tocá para ver</div>`
   :n?`<div class="est wr">🟡 ${n} por enviar${navigator.onLine?'':' · sin conexión'}</div>`
   :navigator.onLine?`<div class=est>🟢 Todo guardado</div>`:`<div class="est wr">🔴 Sin conexión</div>`;
}
async function sync(){
  if(syncing||!S.token)return;syncing=true;
  try{
    while(S.q.length){
      const op=S.q[0];
      try{
        const r=await api(op.path,{method:'POST',body:JSON.stringify(op.body)},30000);
        if(op.tipo==='venta'){S.ult.push({uuid:op.body.client_uuid,id:r.id});S.ult=S.ult.slice(-20)}
        S.q.shift();
      }catch(e){
        if(e.net)break;
        if(e.status===401&&!/PIN/.test(e.message)){S.exp=true;break}
        S.prob.push({tipo:op.tipo,error:e.message,fecha:Date.now()});S.q.shift();
      }
      save();est();
    }
    if(!S.q.length)await refrescar();
  }finally{syncing=false;save();est()}
}
async function refrescar(){
  try{
    S.turno=await api('/api/turnos/actual');
    if(!S.q.length){const[c,s,cl]=await Promise.all([api('/api/catalogo'),api('/api/stock'),api('/api/clientes')]);S.cat=c;S.stk=s;S.cli=cl}
    save();return true;
  }catch(e){if(e.status===401&&!S.q.length)S.exp=true;return false}
}
window.addEventListener('online',()=>{sync()});window.addEventListener('offline',est);
setInterval(()=>{if(S.q.length&&navigator.onLine)sync()},30000);

/* ---------- acceso ---------- */
async function loadUsers(){
  msg='Conectando con el servidor… la primera vez del día puede tardar hasta un minuto';go('wait');
  try{usr=await api('/api/usuarios/publico');go('users')}catch(e){msg=e.message;go('fail')}
}
function pinScr(t,back,fn,sign){ptitle=t;pback=back;cb=fn;psign=!!sign;pin='';go('pin')}
function key(k){
  if(k==='⌫')pin=pin.slice(0,-1);
  else if(k==='✓'){if(pin.length>=4){const p=pin;pin='';err='';cb(p)}return}
  else if(pin.length<8)pin+=k;
  R();
}
function pickUser(i){sel=usr[i];err='';pinScr('PIN de '+sel.nombre,'users',doLogin)}
async function doLogin(p){
  msg='Entrando…';go('wait');
  try{
    const r=await api('/api/login',{method:'POST',body:JSON.stringify({usuario_id:sel.id,pin:p})});
    S.token=r.token;S.user=r.usuario;S.exp=false;save();await refrescar();entrar();
  }catch(e){err=e.message;pinScr('PIN de '+sel.nombre,'users',doLogin)}
}
function entrar(){
  if(S.q.length)sync();
  if(!S.turno)return go('fondo');
  if(S.turno.user_id===S.user.id||S.user.rol==='admin')go('home');else go('otro');
}
async function abrirTurno(){
  const fondo=+$('#f').value||0;msg='Abriendo turno…';go('wait');
  try{await api('/api/turnos/abrir',{method:'POST',body:JSON.stringify({fondo})});await refrescar();go('home')}catch(e){msg=e.message;backTo='fondo';go('err')}
}
function salir(){S.token=null;S.user=null;S.exp=false;save();loadUsers()}

/* ---------- ventas y cobros ---------- */
function add(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);R()}
function fx(b,s){
  if(b.lineas){
    let t=0;
    b.lineas.forEach(l=>{const p=S.cat.find(x=>x.id==l.producto_id);if(!p)return;t+=p.precio*l.cantidad;
      p.receta.forEach(r=>{const i=S.stk.find(x=>x.id==r.item_id);if(i)i.stock=Math.round((i.stock-s*r.cantidad*l.cantidad)*1000)/1000})});
    if(b.tipo==='credito'){const c=S.cli.find(x=>x.id==b.cliente_id);if(c)c.saldo+=s*t}
  }else{const c=S.cli.find(x=>x.id==b.cliente_id);if(c)c.saldo-=s*b.monto}
}
function vender(t){
  pend={tipo:'venta',body:{tipo:t,lineas:lineas()}};
  if(t==='contado'){offConf=!navigator.onLine;confirmar({})}else go('client');
}
async function elegirCliente(id){sel=S.cli.find(c=>c.id===id);pend.body.cliente_id=id;await irConf()}
async function nuevoCliente(){
  const n=$('#nc').value.trim();if(n.length<2)return;
  try{const r=await api('/api/clientes',{method:'POST',body:JSON.stringify({nombre:n})});S.cli.push({id:r.id,nombre:n,saldo:0,tiene_pin:false});save();await elegirCliente(r.id)}
  catch(e){msg=e.net?'Para agregar un cliente nuevo hace falta conexión':e.message;backTo='client';go('err')}
}
async function irConf(){
  if(S.q.length){msg='Enviando operaciones pendientes…';go('wait');await sync()}
  offConf=S.q.length>0||!navigator.onLine;err='';
  if(sel.tiene_pin&&!offConf)pinScr(sel.nombre+', ingresá tu PIN','client',p=>confirmar({cliente_pin:p}),true);else go('firma');
}
async function confirmar(extra){
  const op={tipo:pend.tipo,path:pend.tipo==='venta'?'/api/ventas':'/api/pagos',body:{...pend.body,...extra,client_uuid:uid()}};
  if(!offConf&&!S.q.length){
    try{msg='Registrando…';go('wait');const r=await api(op.path,{method:'POST',body:JSON.stringify(op.body)});return fin(op,r)}
    catch(e){
      if(!e.net){
        if(e.status===401&&!/PIN/.test(e.message)){S.exp=true;est();msg='La sesión venció. Entrá de nuevo; no se perdió nada.';backTo='home';return go('err')}
        if(/PIN/.test(e.message)){err=e.message;return pinScr(sel.nombre+', ingresá tu PIN','client',p=>confirmar({cliente_pin:p}),true)}
        msg=e.message;backTo='home';return go('err');
      }
      if(extra.cliente_pin){offConf=true;err='Se cortó la conexión: pedí que firme';return go('firma')}
    }
  }
  S.q.push(op);fin(op,null);
}
function fin(op,r){
  fx(op.body,1);
  const b=op.body,t=op.tipo==='venta'?b.lineas.reduce((s,l)=>s+l.cantidad*S.cat.find(p=>p.id==l.producto_id).precio,0):b.monto;
  if(op.tipo==='venta'){S.last={uuid:b.client_uuid,tipo:'venta',fx:{lineas:b.lineas,tipo:b.tipo,cliente_id:b.cliente_id}};if(r){S.ult.push({uuid:b.client_uuid,id:r.id});S.ult=S.ult.slice(-20)}}
  else S.last=null;
  msg=`${gs(t)} ${op.tipo==='pago'?'cobrado':b.tipo==='contado'?'al contado':'a crédito'}${r?'':' · se enviará al volver internet'}`;
  cart={};save();go('ok');setTimeout(()=>{if(V==='ok')go('home')},1400);
  if(r)refrescar().then(est);else sync();
}
async function undo(){
  const L=S.last;if(!L)return;
  const i=S.q.findIndex(o=>o.body.client_uuid===L.uuid);
  if(i>=0)S.q.splice(i,1);
  else{
    const u=S.ult.find(x=>x.uuid===L.uuid);if(!u)return;
    try{await api(`/api/ventas/${u.id}/anular`,{method:'POST',body:JSON.stringify({motivo:'Corrección de la empleada'})})}catch(e){msg=e.message;backTo='home';return go('err')}
  }
  fx(L.fx,-1);S.last=null;save();go('home');
}
function pagar(m){pend={tipo:'pago',body:{cliente_id:sel.id,monto:m}};irConf()}
function sigInit(){
  const c=$('#sg'),x=c.getContext('2d');if(!x)return;x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.lineWidth=4;x.lineCap='round';x.strokeStyle='#000';
  let d=false,m=false;
  const p=e=>{const r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[(t.clientX-r.left)*c.width/r.width,(t.clientY-r.top)*c.height/r.height]};
  const s=e=>{e.preventDefault();d=true;const[a,b]=p(e);x.beginPath();x.moveTo(a,b)},mv=e=>{if(!d)return;e.preventDefault();const[a,b]=p(e);x.lineTo(a,b);x.stroke();m=true},en=()=>{d=false};
  ['mousedown','touchstart'].forEach(v=>c.addEventListener(v,s,{passive:false}));
  ['mousemove','touchmove'].forEach(v=>c.addEventListener(v,mv,{passive:false}));
  ['mouseup','mouseleave','touchend'].forEach(v=>c.addEventListener(v,en));
  window.sigOk=()=>m?confirmar({firma:c.toDataURL('image/png')}):alert('Falta la firma');
}

/* ---------- cierre de caja ---------- */
const cc=(d,n)=>{cash[d]=Math.max(0,(cash[d]||0)+n);R()},ci=(id,n)=>{cnt[id]=Math.max(0,Math.round(((cnt[id]||0)+n)*1000)/1000);R()};
const pasoDe=i=>i.paso||1;
async function cerrar(){
  msg='Cerrando caja…';go('wait');await sync();
  if(S.q.length){msg='Hay operaciones sin enviar. Conectate a internet y probá de nuevo.';backTo='c2';return go('err')}
  try{
    res=await api(`/api/turnos/${S.turno.id}/cerrar`,{method:'POST',body:JSON.stringify({efectivo_contado:DEN.reduce((s,d)=>s+d*(cash[d]||0),0),conteo:S.stk.map(i=>({item_id:i.id,contado:cnt[i.id]||0}))})});
    S.turno=null;S.last=null;S.ult=[];save();go('c3');
  }catch(e){msg=e.message;backTo='c2';go('err')}
}

/* ---------- pantallas ---------- */
const W={
boot:()=>'',
wait:()=>`<h1>Un momento…</h1><p class=mut>${msg}</p>`,
err:()=>`<h1>Atención</h1><p class=er>${msg}</p><button class=b onclick="go('${backTo}')">Volver</button>`,
fail:()=>`<h1>No hay conexión</h1><p class=er>${msg}</p><button class=b onclick="loadUsers()">Reintentar</button>${S.token&&S.turno?`<button class="b ghost" onclick="go('home')">Seguir trabajando sin conexión</button>`:''}`,
setup:()=>`<h1>Primera vez</h1><p class=mut>Escribí la dirección del servidor (te la da el administrador).</p><input id=u placeholder="https://cantina-api….onrender.com"><button class="b ok" onclick="const v=$('#u').value.trim();if(/^https?:\\/\\//.test(v)){S.api=v;save();loadUsers()}">Guardar</button>`,
users:()=>`<h1>¿Quién atiende?</h1>${usr.map((u,i)=>`<button class=b onclick="pickUser(${i})">${u.nombre}</button>`).join('')}`,
pin:()=>`${hd(ptitle,pback)}${err?`<p class=er>${err}</p>`:''}<div class=dots>${'●'.repeat(pin.length)||'&nbsp;'}</div><div class=kp>${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button onclick="key('${k}')">${k}</button>`).join('')}</div>${psign?`<button class="b ghost" onclick="go('firma')">Prefiere firmar</button>`:''}`,
fondo:()=>`<h1>Empezar turno</h1><p>${S.user.nombre}, ¿con cuánto efectivo empezás?</p><input id=f type=tel value=100000><button class="b ok" onclick="abrirTurno()">Empezar turno</button><button class="b ghost" onclick="salir()">Cambiar de usuario</button>`,
otro:()=>`<h1>Turno abierto</h1><p>Hay un turno abierto de <b>${S.turno.empleada}</b>. Tiene que cerrar su caja antes de que vos empieces.</p><button class=b onclick="salir()">Volver</button>`,
home:()=>`<h1>Hola, ${S.user.nombre}</h1><button class="b ok" onclick="cart={};go('sell')">🛒 Vender</button><button class="b cr" onclick="go('debts')">💰 Cobrar deuda</button><button class=b onclick="go('stock')">📦 Stock</button><button class="b bad" onclick="cash={};cnt={};go('c1')">🔴 Cerrar caja</button>${S.last?`<button class="b ghost" onclick="undo()">Deshacer última venta</button>`:''}`,
sell:()=>`${hd('Vender','home')}<div class=grid>${S.cat.map(p=>{const q=cart[p.id]||0;return `<div class="tile ${q?'on':''}" onclick="add(${p.id},1)"><b>${p.nombre}</b><span>${gs(p.precio)}</span>${q?`<i class=q>${q}</i><button class=m onclick="event.stopPropagation();add(${p.id},-1)">−</button>`:''}</div>`}).join('')}</div><div class=bar><div><small>Total</small><strong>${gs(cartT())}</strong></div><button class=b ${cartT()?'':'disabled'} onclick="go('how')">Cobrar</button></div>`,
how:()=>`${hd('¿Cómo paga?','sell')}<p>Total: <b>${gs(cartT())}</b></p><button class="b ok" onclick="vender('contado')">Contado</button><button class="b cr" onclick="vender('credito')">Crédito</button>`,
client:()=>`${hd('¿A quién se fía?','how')}${S.cli.map(c=>`<div class=row onclick="elegirCliente(${c.id})"><div>${c.nombre}</div><small>debe ${gs(c.saldo)}</small></div>`).join('')}<input id=nc placeholder="Cliente nuevo: nombre"><button class="b ghost" onclick="nuevoCliente()">Agregar y fiar</button>`,
firma:()=>`${hd('Firma del cliente',pend&&pend.tipo==='pago'?'debt':'client')}${err?`<p class=er>${err}</p>`:''}<p class=mut>${sel.nombre}, firmá con el dedo.${offConf?' (Sin conexión: se confirma con firma.)':''}</p><canvas id=sg width=600 height=260></canvas><button class="b ok" onclick="sigOk()">Confirmar</button><button class="b ghost" onclick="go('firma')">Borrar firma</button>`,
ok:()=>`<div class=full><div>✓</div><h1>Registrado</h1><p>${msg}</p></div>`,
debts:()=>{const l=S.cli.filter(c=>c.saldo>0);return `${hd('Cobrar deuda','home')}${l.map(c=>`<div class=row onclick="sel=S.cli.find(x=>x.id===${c.id});go('debt')"><div>${c.nombre}</div><b>${gs(c.saldo)}</b></div>`).join('')||'<p>Nadie debe nada 🎉</p>'}`},
debt:()=>`${hd(sel.nombre,'debts')}<p>Debe <b>${gs(sel.saldo)}</b></p><button class="b ok" onclick="pagar(${sel.saldo})">Pagó todo</button><input id=pa type=tel placeholder="Pago parcial (Gs)"><button class="b ghost" onclick="const m=+$('#pa').value;if(m>0&&m<=sel.saldo)pagar(m)">Registrar pago parcial</button>`,
stock:()=>`${hd('Stock','home')}${S.stk.map(i=>`<div class=row style="cursor:default"><span class=dot style="background:var(${i.stock<=0?'--bad':i.stock<=i.minimo?'--cr':'--ok'})"></span><div>${i.nombre}</div><b>${i.stock}</b></div>`).join('')}`,
c1:()=>{const t=DEN.reduce((s,d)=>s+d*(cash[d]||0),0);return `${hd('Cerrar caja: efectivo','home')}<p>Contá billetes y monedas.</p>${DEN.map(d=>`<div class=row style="cursor:default"><div>${gs(d)}</div><div class=st><button onclick="cc(${d},-1)">−</button><b>${cash[d]||0}</b><button onclick="cc(${d},1)">+</button></div></div>`).join('')}<div class=bar><div><small>Contado</small><strong>${gs(t)}</strong></div><button class=b onclick="go('c2')">Seguir</button></div>`},
c2:()=>`${hd('Cerrar caja: mercadería','c1')}<p>Contá lo que queda.</p>${S.stk.map(i=>`<div class=row style="cursor:default"><div>${i.nombre}</div><div class=st><button onclick="ci(${i.id},-${pasoDe(i)})">−</button><b>${cnt[i.id]||0}</b><button onclick="ci(${i.id},${pasoDe(i)})">+</button></div></div>`).join('')}<div class=bar><div></div><button class="b bad" onclick="cerrar()">Cerrar y ver resultado</button></div>`,
c3:()=>`<h1>Resultado del cierre</h1><div class=row style="display:block;cursor:default"><table><tr><td>Fondo inicial</td><td>${gs(res.fondo)}</td></tr><tr><td>Ventas contado</td><td>${gs(res.ventas_contado)}</td></tr><tr><td>Cobros de deudas</td><td>${gs(res.cobros)}</td></tr><tr><td><b>Debería haber</b></td><td><b>${gs(res.esperado)}</b></td></tr><tr><td>Contaste</td><td>${gs(res.contado)}</td></tr><tr><td><b>Diferencia</b></td><td class="${res.diferencia<0?'neg':'pos'}"><b>${res.diferencia>0?'+':''}${gs(res.diferencia)}</b></td></tr></table></div><div class=row style="display:block;cursor:default"><table><tr><th>Mercadería</th><th>Debe haber</th><th>Contaste</th></tr>${res.items.map(i=>`<tr><td>${i.nombre}</td><td>${i.esperado}</td><td class="${i.diferencia<0?'neg':i.diferencia>0?'pos':''}">${i.contado}</td></tr>`).join('')}</table></div><button class="b ok" onclick="salir()">Terminar</button>`,
prob:()=>`${hd('Sin registrar','home')}<p class=mut>Estas operaciones no se pudieron registrar. Avisale al administrador.</p>${S.prob.map(p=>`<div class=row style="display:block;cursor:default"><b>${p.tipo==='venta'?'Venta':'Cobro'}</b> · ${new Date(p.fecha).toLocaleString('es-PY')}<div class=er>${p.error}</div></div>`).join('')}<button class=b onclick="S.prob=[];save();go('home')">Entendido</button>`
};
function R(){
  $('#app').innerHTML=(W[V]||W.boot)();
  if(V==='firma')sigInit();
  est();window.scrollTo(0,0);
}
function boot(){
  if(!base())return go('setup');
  if(S.token&&S.user&&S.turno&&!S.exp){go('home');sync();return}
  loadUsers();
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script></body></html>
