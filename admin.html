<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cantina · Administración</title>
<style>
:root{--bg:#F4F1EA;--card:#FDFCF9;--ink:#2C2C2A;--mut:#5F5E5A;--line:#E8E4D9;--ok:#2F8F5B;--okbg:#EAF3DE;--cr:#993C1D;--crbg:#FAECE7;--bad:#C94F4F;--pur:#534AB7;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Inter,-apple-system,'Segoe UI',sans-serif}
#app{max-width:1100px;margin:0 auto;padding:14px}
h1{font-size:24px;margin:6px 0 12px}h2{font-size:18px;margin:18px 0 8px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
nav button,.bt{border:1px solid #D8D3C5;background:var(--card);color:var(--ink);font:600 15px inherit;border-radius:10px;padding:9px 14px;cursor:pointer}
nav button.on,.bt.p{background:var(--ink);color:#fff;border-color:var(--ink)}.bt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.bt.r{color:var(--cr);border-color:var(--cr)}.bt.s{padding:5px 10px;font-size:14px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;overflow-x:auto}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.kp .cd{margin:0}.kp small{display:block;color:var(--mut)}.kp b{font-size:20px}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mut);font-size:13px}.n{text-align:right;white-space:nowrap}
.an{text-decoration:line-through;color:#999}.neg{color:var(--bad)}.pos{color:#27500A}
input,select{font:inherit;padding:9px 10px;border:1px solid #D8D3C5;border-radius:10px;background:#fff;margin:0 6px 8px 0;max-width:100%}
.er{background:var(--crbg);color:#712B13;padding:8px 12px;border-radius:10px}.ok{color:#27500A;background:var(--okbg);padding:8px 12px;border-radius:10px}
.mut{color:var(--mut)}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.bar h1{margin:0;flex:1}
.it{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.it .m{flex:1 1 200px;min-width:0}.it .a{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 12px;margin-top:8px}.kv span{display:block;color:var(--mut);font-size:13px}
.rr{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}.rr select{flex:1 1 150px;min-width:0;margin:0}.rr input{width:80px;margin:0}
</style></head><body><div id="app"></div>
<script src="config.js"></script>
<script>
const K='cantina_admin';let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),fm=n=>String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'.'),gs=n=>fm(n)+' Gs';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const base=()=>String(window.CANTINA_API||S.api||'').replace(/\/$/,'');
const MN={efectivo:'Efectivo',pos_debito:'POS Débito',pos_credito:'POS Crédito',transferencia:'Transferencia'};
const hh=x=>x?new Date(x).toLocaleString('es-PY',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const num=v=>Number(String(v).replace(/\./g,'').replace(',','.'));
const dec=v=>Number(String(v).trim().replace(',','.'));
let T='hoy',F='',FK='',AF='',ED=null,REC={RE:[],RN:[]},IT=[],PR=[],US=[],usr=[],sel=null;
async function A(path,opt={}){
  const h={...(S.token?{Authorization:'Bearer '+S.token}:{}),...(opt.body&&!(opt.body instanceof FormData)?{'Content-Type':'application/json'}:{})};
  let r;try{r=await fetch(base()+path,{...opt,headers:h})}catch(e){throw new Error('Sin conexión con el servidor')}
  const d=await r.json().catch(()=>({}));
  if(!r.ok){
    if(r.status===401&&S.token&&path!=='/api/login'){S.token=null;sv();setTimeout(R,0)}
    const x=d.detail,e=new Error(typeof x==='string'?x:(x&&x.mensaje)||'Error '+r.status);e.det=x;throw e}
  return d}
const post=(p,b,m='POST')=>A(p,{method:m,body:JSON.stringify(b)});
async function run(fn){try{await fn();show(T)}catch(e){alert(e.message)}}

/* ---- acceso ---- */
async function R(){
  const a=$('#app');
  if(!base()){a.innerHTML=`<h1>Primera vez</h1><p class=mut>Dirección de la API:</p><input id=u placeholder="https://cantina-api….onrender.com" style="width:100%"><button class="bt ok" onclick="const v=$('#u').value.trim();if(/^https?:\\/\\//.test(v)){S.api=v;sv();R()}">Guardar</button>`;return}
  if(!S.token){
    a.innerHTML='<h1>Administración</h1><p class=mut>Conectando… la primera vez del día puede tardar hasta un minuto.</p>';
    try{usr=(await A('/api/usuarios/publico')).filter(u=>u.rol==='admin')}catch(e){a.innerHTML=`<h1>Administración</h1><p class=er>${esc(e.message)}</p><button class=bt onclick="R()">Reintentar</button>`;return}
    a.innerHTML=`<h1>Administración</h1><select id=lu>${usr.map(u=>`<option value=${u.id}>${esc(u.nombre)}</option>`).join('')}</select><input id=lp type=password inputmode=numeric placeholder="PIN" onkeydown="if(event.key==='Enter')entrar()"><button class="bt ok" onclick="entrar()">Entrar</button><p id=le class=er style="display:none"></p>`;return}
  a.innerHTML=`<div class=bar><h1>Cantina · Administración</h1><button class=bt onclick="S.token=null;sv();R()">Salir</button></div><nav>${[['hoy','Hoy'],['turnos','Turnos'],['stock','Stock'],['prod','Productos'],['pers','Personas'],['imp','Importar Excel'],['aud','Auditoría']].map(([k,n])=>`<button id=t_${k} onclick="show('${k}')">${n}</button>`).join('')}</nav><div id=c></div>`;
  show(T)}
async function entrar(){
  try{const r=await post('/api/login',{usuario_id:+$('#lu').value,pin:$('#lp').value});
    if(r.usuario.rol!=='admin')throw new Error('Solo administradores');S.token=r.token;sv();R()}
  catch(e){const x=$('#le');x.style.display='block';x.textContent=e.message}}
async function show(t){
  T=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id==='t_'+t));
  const c=$('#c');if(!c)return;c.innerHTML='<p class=mut>Cargando…</p>';
  try{c.innerHTML=await V[t]()}catch(e){c.innerHTML=`<p class=er>${esc(e.message)}</p>`}}

/* ---- acciones ---- */
function an(tipo,id){const m=prompt('Motivo de la anulación (mínimo 3 letras)');if(!m||m.trim().length<3)return;run(()=>post(`/api/${tipo}/${id}/anular`,{motivo:m.trim()}))}
function ajuste(id,motivo){const q=dec(prompt(motivo==='entrada'?'¿Cuánto entró?':'¿Cuánto se perdió (merma)?')||'');if(q>0)run(()=>post('/api/admin/stock/ajuste',{item_id:id,cantidad:q,motivo}))}
function itemNuevo(){const n=$('#in').value.trim();if(n.length<2)return alert('Falta el nombre');
  run(()=>post('/api/admin/items',{nombre:n,unidad:$('#iu').value||'unidad',stock:dec($('#is').value||0),minimo:dec($('#im').value||0),paso:dec($('#ip').value||1)}))}
function recEd(n){
  return REC[n].map((r,i)=>{const it=IT.find(x=>x.id==r.item_id);return `<div class=rr><select onchange="recSet('${n}',${i},'item_id',this.value)"><option value="">Elegir item…</option>${IT.map(x=>`<option value=${x.id} ${x.id==r.item_id?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select><input size=5 inputmode=decimal value="${esc(r.cantidad)}" onchange="recSet('${n}',${i},'cantidad',this.value)"><span class=mut>${it?esc(it.unidad):'cant.'}</span><button class="bt s r" onclick="recDel('${n}',${i})">✕</button></div>`}).join('')+`<button class="bt s" onclick="recAdd('${n}')">+ Agregar item</button>`}
const recDraw=n=>{const e=$('#rec_'+n);if(e)e.innerHTML=recEd(n)};
function recSet(n,i,f,v){REC[n][i][f]=v;if(f==='item_id')recDraw(n)}
function recAdd(n){REC[n].push({item_id:'',cantidad:'1'});recDraw(n)}
function recDel(n,i){REC[n].splice(i,1);recDraw(n)}
function recOut(n){const o=[],v=new Set();
  for(const r of REC[n]){if(!r.item_id)continue;const c=dec(r.cantidad);
    if(!(c>0))throw new Error('Hay una cantidad inválida en la receta');
    if(v.has(+r.item_id))throw new Error('Hay un item repetido en la receta');
    v.add(+r.item_id);o.push({item_id:+r.item_id,cantidad:c})}
  return o}
const recTxt=p=>p.receta.map(r=>`${(IT.find(i=>i.id===r.item_id)||{nombre:'?'}).nombre}:${r.cantidad}`).join('; ');
function prNuevo(){const n=$('#pn').value.trim(),pr=num($('#pp').value||0);if(n.length<2||!(pr>=0))return alert('Falta nombre o precio');
  run(async()=>{await post('/api/admin/productos',{nombre:n,precio:pr,receta:recOut('RN')});REC.RN=[]})}
function prPrecio(id){const p=PR.find(x=>x.id===id),v=prompt('Nuevo precio de '+p.nombre,p.precio);if(v!==null&&num(v)>=0)run(()=>post('/api/admin/productos/'+id,{precio:num(v)},'PATCH'))}
function prRec(id){const p=PR.find(x=>x.id===id);ED=id;REC.RE=p.receta.map(r=>({item_id:r.item_id,cantidad:String(r.cantidad)}));show('prod').then(()=>window.scrollTo(0,0))}
function edGuardar(){run(async()=>{await post('/api/admin/productos/'+ED,{receta:recOut('RE')},'PATCH');ED=null})}
function prAct(id,a){run(()=>post('/api/admin/productos/'+id,{activo:a},'PATCH'))}
function usNuevo(){const n=$('#un').value.trim(),p=$('#up').value.trim();if(n.length<2||p.length<4)return alert('Falta nombre o PIN');
  run(()=>post('/api/admin/usuarios',{nombre:n,pin:p,rol:$('#ur').value}))}
function usPin(id){const p=prompt('Nuevo PIN (4 a 8 números; administrador 6 a 8)');if(p)run(()=>post('/api/admin/usuarios/'+id,{pin:p},'PATCH'))}
function usAct(id,a){run(()=>post('/api/admin/usuarios/'+id,{activo:a},'PATCH'))}
async function subir(){
  const f=$('#fx').files[0];if(!f)return alert('Elegí el archivo .xlsx');
  const fd=new FormData();fd.append('archivo',f);$('#ri').innerHTML='<p class=mut>Subiendo…</p>';
  try{const r=await A('/api/admin/importar',{method:'POST',body:fd});
    $('#ri').innerHTML='<p class=ok>Listo · '+Object.entries(r).map(([k,v])=>k.replace(/_/g,' ')+': '+v).join(' · ')+'</p>'}
  catch(e){$('#ri').innerHTML=`<p class=er>${esc(e.message)}</p>`+(e.det&&e.det.errores?'<ul>'+e.det.errores.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')}}

/* ---- pantallas ---- */
const posTxt=t=>t.lote_debito==null&&t.lote_credito==null?'—':[['Déb',t.lote_debito,t.pos_debito],['Créd',t.lote_credito,t.pos_credito]].map(([n,l,a])=>`<span class="${(l||0)!==(a||0)?'neg':''}">${n}: ${gs(l||0)} / ${gs(a||0)}</span>`).join('<br>');
const V={
hoy:async()=>{
  const d=await A('/api/admin/movimientos'+(F?'?fecha='+F:''));
  const rows=[
    ...d.ventas.map(v=>({k:'ventas',cat:v.tipo,id:v.id,f:v.creada_en,e:v.empleada,t:v.tipo==='contado'?'Venta · '+MN[v.medio||'efectivo']:'Crédito · '+(v.cliente||''),x:v.lineas.map(l=>l.cantidad+'× '+l.nombre).join(', ')+(v.comprobante?' · Boleta POS: '+v.comprobante:''),m:v.total,a:v.anulada,mo:v.motivo_anulacion})),
    ...d.pagos.map(p=>({k:'pagos',cat:'cobros',id:p.id,f:p.creado_en,e:p.empleada,t:'Cobro · '+MN[p.medio||'efectivo'],x:p.cliente+(p.comprobante?' · Boleta POS: '+p.comprobante:''),m:p.monto,a:p.anulado})),
    ...d.gastos.map(g=>({k:'gastos',cat:'gastos',id:g.id,f:g.creado_en,e:g.empleada,t:'Gasto',x:g.concepto,m:-g.monto,a:g.anulado}))
  ].filter(r=>!FK||r.cat===FK).sort((a,b)=>a.f<b.f?-1:1);
  const hoy=new Date().toLocaleDateString('en-CA');
  const KP=[['contado','Ventas contado',d.total_contado],['credito','Ventas a crédito',d.total_credito],['cobros','Cobros de deudas',d.total_cobros],['gastos','Gastos de caja',d.total_gastos]];
  return `<div class=bar><input type=date id=fd value="${F||hoy}" onchange="F=this.value;show('hoy')"><span class=mut>${d.anuladas} anulada(s)</span></div>
  <div class=kp>${KP.map(([k,n,v])=>`<div class=cd onclick="FK=FK==='${k}'?'':'${k}';show('hoy')" style="cursor:pointer;${FK===k?'border:2px solid var(--ok);background:var(--okbg)':''}"><small>${n}</small><b>${gs(v)}</b></div>`).join('')}</div>
  ${FK?`<p class=mut>Mostrando solo: <b>${KP.find(x=>x[0]===FK)[1]}</b> · tocá la tarjeta otra vez para ver todo</p>`:'<p class=mut><small>Tocá una tarjeta para filtrar el detalle.</small></p>'}
  <div class=cd><b>Cobrado por medio</b> (contado + cobros)<table>${Object.entries(d.por_medio).map(([k,v])=>`<tr><td>${MN[k]}</td><td class=n>${gs(v)}</td></tr>`).join('')}</table></div>
  ${rows.map(r=>`<div class="it ${r.a?'an':''}"><div class=m><b>${esc(r.t)}</b> <span class=mut>· ${hh(r.f).slice(-5)} · ${esc(r.e)}</span><br><small class=mut>${esc(r.x)}${r.a?' · ANULADA'+(r.mo?': '+esc(r.mo):''):''}</small></div><div class=a><b>${gs(r.m)}</b>${r.a?'':`<button class="bt s r" onclick="an('${r.k}',${r.id})">Anular</button>`}</div></div>`).join('')||'<p class=mut>Sin movimientos</p>'}`},
turnos:async()=>{
  const ts=await A('/api/admin/turnos');
  return ts.map(t=>{const c=!!t.cerrado_en,df=t.items.filter(i=>i.diferencia!==0).length;
    return `<div class=cd><b>Turno #${t.id} · ${esc(t.empleada)}</b><br><small class=mut>${hh(t.abierto_en)} → ${c?hh(t.cerrado_en):'<b>ABIERTO</b>'}</small><div class=kv><div><span>Fondo</span><b>${gs(t.fondo)}</b></div>${c?`<div><span>Esperado</span><b>${gs(t.esperado)}</b></div><div><span>Contado</span><b>${gs(t.contado)}</b></div><div><span>Diferencia</span><b class="${t.diferencia<0?'neg':t.diferencia>0?'pos':''}">${t.diferencia>0?'+':''}${gs(t.diferencia)}</b></div><div><span>POS (cierre / app)</span>${posTxt(t)}</div><div><span>Mercadería</span>${df?`<b class=neg>${df} con diferencia</b>`:'<b>Sin diferencias</b>'}</div>`:''}</div></div>`}).join('')||'<p class=mut>Sin turnos</p>'},
stock:async()=>{
  IT=await A('/api/stock');
  return IT.map(i=>`<div class=it><div class=m><span style="color:${i.estado==='rojo'?'var(--bad)':i.estado==='amarillo'?'var(--cr)':'var(--ok)'}">●</span> <b>${esc(i.nombre)}</b> <small class=mut>(${esc(i.unidad)})</small><br><small>Stock <b>${i.stock}</b> · Mínimo ${i.minimo}</small></div><div class=a><button class="bt s" onclick="ajuste(${i.id},'entrada')">+ Entrada</button><button class="bt s r" onclick="ajuste(${i.id},'merma')">− Merma</button></div></div>`).join('')+`<h2>Item nuevo</h2><div class=cd><input id=in placeholder="Nombre"><input id=iu placeholder="Unidad (unidad, litro, kilo…)"><input id=is placeholder="Stock inicial" size=10><input id=im placeholder="Mínimo" size=8><input id=ip placeholder="Paso botones (1)" size=10><button class="bt ok" onclick="itemNuevo()">Agregar</button></div>`},
prod:async()=>{
  [IT,PR]=await Promise.all([A('/api/stock'),A('/api/admin/productos')]);
  return `${ED?`<div class=cd style="border:2px solid var(--ok)"><b>Receta de ${esc((PR.find(p=>p.id===ED)||{}).nombre||'')}</b> <span class=mut>· lo que descuenta de Stock por cada unidad vendida</span><div id=rec_RE style="margin-top:8px">${recEd('RE')}</div><br><button class="bt ok" onclick="edGuardar()">Guardar receta</button> <button class=bt onclick="ED=null;show('prod')">Cancelar</button></div>`:''}${PR.map(p=>`<div class="it ${p.activo?'':'an'}"><div class=m><b>${esc(p.nombre)}</b>${p.activo?'':' <small>(desactivado)</small>'} · ${gs(p.precio)}<br><small class=mut>${esc(recTxt(p))||'Sin receta'}</small></div><div class=a><button class="bt s" onclick="prPrecio(${p.id})">Precio</button><button class="bt s" onclick="prRec(${p.id})">Receta</button><button class="bt s" onclick="prAct(${p.id},${!p.activo})">${p.activo?'Desactivar':'Activar'}</button></div></div>`).join('')}<h2>Producto nuevo</h2><div class=cd><input id=pn placeholder="Nombre"><input id=pp placeholder="Precio" size=10><p class=mut style="margin:4px 0">Receta (opcional): qué items descuenta cada unidad vendida</p><div id=rec_RN>${recEd('RN')}</div><br><button class="bt ok" onclick="prNuevo()">Agregar</button><p class=mut><small>Los items se eligen de la lista de Stock. Para muchos productos a la vez usá Importar Excel.</small></p></div>`},
pers:async()=>{
  const[us,cl]=await Promise.all([A('/api/admin/usuarios'),A('/api/clientes')]);
  return `<h2>Usuarios</h2>${us.map(u=>`<div class="it ${u.activo?'':'an'}"><div class=m><b>${esc(u.nombre)}</b> <span class=mut>· ${u.rol}${u.activo?'':' · desactivado'}</span></div><div class=a><button class="bt s" onclick="usPin(${u.id})">Cambiar PIN</button><button class="bt s" onclick="usAct(${u.id},${!u.activo})">${u.activo?'Desactivar':'Activar'}</button></div></div>`).join('')}<div class=cd><input id=un placeholder="Nombre"><input id=up type=password inputmode=numeric placeholder="PIN" size=10><select id=ur><option value=empleada>Empleada</option><option value=admin>Administrador</option></select><button class="bt ok" onclick="usNuevo()">Agregar usuario</button></div>
  <h2>Clientes</h2>${cl.map(c=>`<div class=it><div class=m><b>${esc(c.nombre)}</b><br><small class=mut>${esc(c.telefono||'Sin teléfono')}</small></div><div class=a><b>${gs(c.saldo)}</b></div></div>`).join('')}<div class=it><div class=m><b>Total por cobrar</b></div><div class=a><b>${gs(cl.reduce((t,c)=>t+c.saldo,0))}</b></div></div>`},
imp:async()=>`<div class=cd><p>Subí la planilla con las hojas <b>Items</b> y <b>Productos</b>. Si una fila tiene error no se carga nada y te indica cuál corregir. El stock de items que ya existen no se modifica.</p><p><a href="plantilla-carga-cantina.xlsx">Descargar la planilla modelo</a></p><input type=file id=fx accept=".xlsx"><button class="bt ok" onclick="subir()">Subir</button><div id=ri></div></div>`,
aud:async()=>{
  const[au,us]=await Promise.all([A('/api/admin/auditoria?limite=300'),A('/api/admin/usuarios')]);const nm=Object.fromEntries(us.map(u=>[u.id,u.nombre]));
  const L={venta_anulada:'Venta anulada',pago_anulado:'Cobro anulado',gasto_anulado:'Gasto anulado',turno_abierto:'Turno abierto',turno_cerrado:'Caja cerrada',gasto:'Gasto cargado',usuario_nuevo:'Usuario creado',usuario_editado:'Usuario modificado',producto_nuevo:'Producto creado',producto_editado:'Producto modificado',item_nuevo:'Item creado',stock_entrada:'Entrada de stock',stock_merma:'Merma de stock',importacion_excel:'Importación de Excel',cliente_nuevo:'Cliente creado',pin_cliente:'PIN de cliente'};
  const MK=new Set(['monto','fondo','diferencia','total','precio']);
  const val=(k,v)=>k==='pos'?['debito','credito'].filter(x=>v[x]).map(x=>`${x==='debito'?'Débito':'Crédito'}: app ${gs(v[x].app)} · POS ${gs(v[x].lote)} · dif. ${gs(v[x].diferencia)}`).join(' | '):MK.has(k)&&typeof v==='number'?gs(v):v&&typeof v==='object'?JSON.stringify(v):v;
  const dt=d=>Object.entries(d||{}).filter(([k,v])=>v!==null&&v!==undefined).map(([k,v])=>k.replace(/_/g,' ')+': '+val(k,v)).join(' · ');
  const rows=au.filter(r=>!AF||r.accion===AF);
