<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-title" content="Mercator Admin"><meta name="theme-color" content="#1B5E3B"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mercator · Administración</title>
<style>
:root{--bg:#F4F9F4;--card:#FFFFFF;--ink:#37474F;--mut:#5F6F76;--line:#DDEBDD;--ok:#1B5E3B;--okbg:#DFF5E1;--cr:#993C1D;--crbg:#FAECE7;--bad:#C94F4F;--pur:#534AB7;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Inter,-apple-system,'Segoe UI',sans-serif}
#app{max-width:1100px;margin:0 auto;padding:14px}
h1{font-size:24px;margin:6px 0 12px}h2{font-size:18px;margin:18px 0 8px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
nav button,.bt{border:1px solid #CFE0D0;background:var(--card);color:var(--ink);font:600 15px inherit;border-radius:10px;padding:9px 14px;cursor:pointer}
nav button.on,.bt.p{background:#1B5E3B;color:#fff;border-color:#1B5E3B}.bt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.bt.r{color:var(--cr);border-color:var(--cr)}.bt.s{padding:5px 10px;font-size:14px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;overflow-x:auto}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.kp .cd{margin:0}.kp small{display:block;color:var(--mut)}.kp b{font-size:20px}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mut);font-size:13px}.n{text-align:right;white-space:nowrap}
.an{text-decoration:line-through;color:#999}.neg{color:var(--bad)}.pos{color:#1B5E3B}
input,select{font:inherit;padding:9px 10px;border:1px solid #D8D3C5;border-radius:10px;background:#fff;margin:0 6px 8px 0;max-width:100%}
.er{background:var(--crbg);color:#712B13;padding:8px 12px;border-radius:10px}.ok{color:#1B5E3B;background:var(--okbg);padding:8px 12px;border-radius:10px}
.mut{color:var(--mut)}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.bar h1{margin:0;flex:1}
.it{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.it .m{flex:1 1 200px;min-width:0}.it .a{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 12px;margin-top:8px}.kv span{display:block;color:var(--mut);font-size:13px}
.hdr{display:flex;align-items:center;gap:10px;background:#1B5E3B;color:#fff;border-radius:14px;padding:10px 14px;margin-bottom:12px}.hdr h1{margin:0;flex:1;font-size:20px;color:#fff}.hdr .logo{width:42px;height:42px}.hdr .ic{width:36px;height:36px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center}.hdr .ic img{width:28px;height:28px}.hdr .bt{background:#DFF5E1;color:#1B5E3B;border-color:#DFF5E1}.brand{display:flex;align-items:center;gap:10px;margin:4px 0 8px}.brand img{width:44px;height:44px}.brand b{font-size:24px;color:#1B5E3B}
.rr{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}.rr select{flex:1 1 150px;min-width:0;margin:0}.rr input{width:80px;margin:0}
</style></head><body><div id="app"></div>
<script src="config.js?v=26"></script>
<script src="dialogo.js?v=26"></script>
<script src="informes.js?v=26"></script>
<script src="imprimir.js?v=26"></script>
<script>
(function(){const m=e=>{const a=document.getElementById('app');if(a&&!a.innerHTML.trim())a.innerHTML='<p style="margin:16px;padding:12px;background:#FAECE7;color:#712B13;border-radius:10px">No se pudo cargar la pantalla ('+String(e&&e.message||e)+'). Recargá la página; si sigue igual, comprobá que estén subidos todos los archivos de la última versión.</p>'};window.addEventListener('error',e=>m(e.error||e.message));window.addEventListener('unhandledrejection',e=>m(e.reason))})();
const K='cantina_admin';let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),fm=n=>String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'.'),gs=n=>fm(n)+' Gs';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const base=()=>String(window.CANTINA_API||S.api||'').replace(/\/$/,'');
const MN={efectivo:'Efectivo',pos_debito:'POS Débito',pos_credito:'POS Crédito',transferencia:'Transferencia'};
const hh=x=>x?new Date(x).toLocaleString('es-PY',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const num=v=>Number(String(v).replace(/\./g,'').replace(',','.'));
const dec=v=>Number(String(v).trim().replace(',','.'));
let T='dash',DS=null,EC=null,CFE=null,CFGD=null,F='',FK='',AF='',ED=null,REC={RE:[],RN:[]},IT=[],PR=[],US=[],usr=[],sel=null;
let CP=null,CN=null,COMPS=[],PV=[],PQ='',PQ2='',IQ='',BKO=false,BK={},BQ='',UN=[],ITE=null,PRE=null;
const fmtIn=el=>{const n=el.value.replace(/\D/g,'');el.value=n?fm(Number(n)):''};
const uid=()=>(window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,12));
let CB=null,CBO=false,CL=[],CQ='';
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
async function A(path,opt={}){
  const h={...(S.token?{Authorization:'Bearer '+S.token}:{}),...(opt.body&&!(opt.body instanceof FormData)?{'Content-Type':'application/json'}:{})};
  let r;try{r=await fetch(base()+path,{...opt,headers:h})}catch(e){throw new Error('Sin conexión con el servidor')}
  const d=await r.json().catch(()=>({}));
  if(!r.ok){
    if(r.status===401&&S.token&&path!=='/api/login'){S.token=null;sv();setTimeout(R,0)}
    const x=d.detail,e=new Error(typeof x==='string'?x:(x&&x.mensaje)||'Error '+r.status);e.det=x;throw e}
  return d}
const post=(p,b,m='POST')=>A(p,{method:m,body:JSON.stringify(b)});
async function run(fn){try{await fn();show(T)}catch(e){alert(e.message)}}

/* ---- acceso ---- */
async function R(){
  const a=$('#app');
  if(!base()){a.innerHTML=`<h1>Primera vez</h1><p class=mut>Dirección de la API:</p><input id=u placeholder="https://cantina-api….onrender.com" style="width:100%"><button class="bt ok" onclick="const v=$('#u').value.trim();if(/^https?:\\/\\//.test(v)){S.api=v;sv();R()}">Guardar</button>`;return}
  if(!S.token){
    a.innerHTML='<div class=brand><img src="icon-192.png" alt=""><b>Mercator</b></div><h1>Administración</h1><p class=mut>Conectando… la primera vez del día puede tardar hasta un minuto.</p>';
    try{usr=(await A('/api/usuarios/publico')).filter(u=>u.rol==='admin')}catch(e){a.innerHTML=`<div class=brand><img src="icon-192.png" alt=""><b>Mercator</b></div><h1>Administración</h1><p class=er>${esc(e.message)}</p><button class=bt onclick="R()">Reintentar</button>`;return}
    a.innerHTML=`<div class=brand><img src="icon-192.png" alt=""><b>Mercator</b></div><h1>Administración</h1><select id=lu>${usr.map(u=>`<option value=${u.id}>${esc(u.nombre)}</option>`).join('')}</select><input id=lp type=password inputmode=numeric placeholder="PIN" onkeydown="if(event.key==='Enter')entrar()"><button class="bt ok" onclick="entrar()">Entrar</button><p id=le class=er style="display:none"></p>`;return}
  try{if(!CFGD)CFGD=await A('/api/config')}catch(e){}
  a.innerHTML=`<div class=hdr id=hdr>${typeof hdrHTML==='function'?hdrHTML():'<h1>Mercator · Administración</h1>'}</div><nav>${[['dash','Dashboard'],['hoy','Hoy'],['cmp','Comparativo'],['cli','Clientes'],['cob','Cobranzas'],['emp','Empresas'],['turnos','Turnos'],['stock','Stock'],['comp','Compras'],['prod','Productos'],['pers','Personas'],['imp','Importar Excel'],['cfg','Configuración'],['aud','Auditoría']].map(([k,n])=>`<button id=t_${k} onclick="navTo('${k}')">${n}</button>`).join('')}</nav><div id=c></div>`;
  show(T)}
async function entrar(){
  try{const r=await post('/api/login',{usuario_id:+$('#lu').value,pin:$('#lp').value});
    if(r.usuario.rol!=='admin')throw new Error('Solo administradores');S.token=r.token;sv();R()}
  catch(e){const x=$('#le');x.style.display='block';x.textContent=e.message}}
async function show(t){
  T=t;if(t!=='cfg')CFE=null;if(t!=='pers')EC=null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id==='t_'+t));
  const c=$('#c');if(!c)return;c.innerHTML='<p class=mut>Cargando…</p>';
  try{c.innerHTML=await V[t]()}catch(e){c.innerHTML=`<p class=er>${esc(e.message)}</p>`}}

/* ---- acciones ---- */
async function an(tipo,id){const m=await preguntar('Motivo de la anulación (mínimo 3 letras)');if(!m||m.trim().length<3)return;run(()=>post(`/api/${tipo}/${id}/anular`,{motivo:m.trim()}))}
async function ajuste(id,motivo){const q=dec(await preguntar(motivo==='entrada'?'¿Cuánto entró?':'¿Cuánto se perdió (merma)?')||'');if(q>0)run(()=>post('/api/admin/stock/ajuste',{item_id:id,cantidad:q,motivo}))}
function itemNuevo(){const n=$('#in').value.trim();if(n.length<2)return alert('Falta el nombre');
  run(()=>post('/api/admin/items',{nombre:n,unidad:$('#iu').value||'unidad',stock:dec($('#is').value||0),minimo:dec($('#im').value||0),paso:dec($('#ip').value||1)}))}
function recEd(n){
  return REC[n].map((r,i)=>{const it=IT.find(x=>x.id==r.item_id);return `<div class=rr><select onchange="recSet('${n}',${i},'item_id',this.value)"><option value="">Elegir item…</option>${IT.map(x=>`<option value=${x.id} ${x.id==r.item_id?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select><input size=5 inputmode=decimal value="${esc(r.cantidad)}" onchange="recSet('${n}',${i},'cantidad',this.value)"><span class=mut>${it?esc(it.unidad):'cant.'}</span><button class="bt s r" onclick="recDel('${n}',${i})">✕</button></div>`}).join('')+`<button class="bt s" onclick="recAdd('${n}')">+ Agregar item</button>`}
const recDraw=n=>{const e=$('#rec_'+n);if(e)e.innerHTML=recEd(n)};
function recSet(n,i,f,v){REC[n][i][f]=v;if(f==='item_id')recDraw(n)}
function recAdd(n){REC[n].push({item_id:'',cantidad:'1'});recDraw(n)}
function recDel(n,i){REC[n].splice(i,1);recDraw(n)}
function recOut(n){const o=[],v=new Set();
  for(const r of REC[n]){if(!r.item_id)continue;const c=dec(r.cantidad);
    if(!(c>0))throw new Error('Hay una cantidad inválida en la receta');
    if(v.has(+r.item_id))throw new Error('Hay un item repetido en la receta');
    v.add(+r.item_id);o.push({item_id:+r.item_id,cantidad:c})}
  return o}
const recTxt=p=>p.receta.map(r=>`${(IT.find(i=>i.id===r.item_id)||{nombre:'?'}).nombre}:${r.cantidad}`).join('; ');
function prNuevo(){const n=$('#pn').value.trim(),pr=num($('#pp').value||0);if(n.length<2||!(pr>=0))return alert('Falta nombre o precio');
  const cs=$('#pc').checked;
  run(async()=>{await post('/api/admin/productos',{nombre:n,precio:pr,receta:recOut('RN'),categoria:$('#pcat').value||null,controlar_stock:cs,stock_inicial:cs?(dec($('#psi').value||0)||0):0,stock_minimo:cs?(dec($('#pmi').value||0)||0):0});REC.RN=[]})}
async function prPrecio(id){const p=PR.find(x=>x.id===id),v=await preguntar('Nuevo precio de '+p.nombre,fm(p.precio));if(v!==null&&num(v)>=0)run(()=>post('/api/admin/productos/'+id,{precio:num(v)},'PATCH'))}
function prRec(id){const p=PR.find(x=>x.id===id);ED=id;REC.RE=p.receta.map(r=>({item_id:r.item_id,cantidad:String(r.cantidad)}));show('prod').then(()=>window.scrollTo(0,0))}
function edGuardar(){run(async()=>{await post('/api/admin/productos/'+ED,{receta:recOut('RE')},'PATCH');ED=null})}
function prAct(id,a){run(()=>post('/api/admin/productos/'+id,{activo:a},'PATCH'))}
/* combos: cada parte lleva una o varias opciones; con una sola opción es fija, con varias se elige al vender */
const cbParte=()=>({nombre:'',cantidad:'1',ops:['']});
const cbBase=()=>({id:null,nombre:'',precio:'',categoria:'',partes:[cbParte(),cbParte()]});
function cbNuevo(){CB=cbBase();CBO=true;show('prod').then(()=>window.scrollTo(0,0))}
function cbEdit(id){const p=PR.find(x=>x.id===id);
  CB={id,nombre:p.nombre,precio:fm(p.precio),categoria:p.categoria||'',partes:(p.partes||[]).map(pt=>({nombre:pt.nombre||'',cantidad:String(pt.cantidad),ops:pt.opciones.map(o=>String(o.producto_id))}))};
  if(!CB.partes.length)CB.partes=cbBase().partes;
  CBO=true;show('prod').then(()=>window.scrollTo(0,0))}
const cbDraw=()=>{const e=$('#cbx');if(e)e.innerHTML=cbHTML()};
function cbHTML(){
  const ops=PR.filter(x=>!x.combo&&x.activo);
  return `<b>${CB.id?'Editar combo':'Combo nuevo'}</b> <span class=mut>· junta dos o más productos con un precio fijo</span><div style="margin-top:8px"></div>
  <input placeholder="Nombre del combo (ej: Almuerzo)" value="${esc(CB.nombre)}" oninput="CB.nombre=this.value"><input placeholder="Precio" size=10 inputmode=numeric value="${esc(CB.precio)}" oninput="fmtIn(this);CB.precio=this.value">${catSel('cb_c',CB.categoria,'CB.categoria=this.value')}
  <p class=mut style="margin:4px 0 8px">Cada <b>parte</b> es algo que lleva el combo. Con una sola opción siempre lleva eso (ej: el jugo). Con dos o más opciones, la empleada elige una <b>al momento de vender</b> (ej: plato de fondo: milanesa de pollo o de carne).</p>
  ${CB.partes.map((pt,i)=>`<div class=cd style="background:#fff"><div class=rr><input placeholder="Nombre de la parte (ej: Plato de fondo)" value="${esc(pt.nombre)}" oninput="CB.partes[${i}].nombre=this.value" style="flex:1 1 180px;width:auto"><input size=3 inputmode=numeric value="${esc(pt.cantidad)}" oninput="CB.partes[${i}].cantidad=this.value" title="Cantidad"><button class="bt s r" onclick="CB.partes.splice(${i},1);cbDraw()">Quitar parte</button></div>
    ${pt.ops.map((o,j)=>`<div class=rr><select onchange="CB.partes[${i}].ops[${j}]=this.value;cbDraw()"><option value="">Elegir producto…</option>${ops.map(x=>`<option value=${x.id} ${x.id==o?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select>${pt.ops.length>1?`<button class="bt s r" onclick="CB.partes[${i}].ops.splice(${j},1);cbDraw()">✕</button>`:''}</div>`).join('')}
    <button class="bt s" onclick="CB.partes[${i}].ops.push('');cbDraw()">+ Otra opción</button> <span class=mut>${pt.ops.filter(Boolean).length>1?'Se elige al vender':'Fija: siempre lleva esto'}</span></div>`).join('')}
  <button class="bt s" onclick="CB.partes.push(cbParte());cbDraw()">+ Agregar parte</button><br><br>
  <button class="bt ok" onclick="cbGuardar()">Guardar combo</button> <button class=bt onclick="CBO=false;show('prod')">Cancelar</button>`}
function cbGuardar(){
  const n=CB.nombre.trim(),pr=num(CB.precio||'');if(n.length<2||!(pr>=0))return alert('Falta el nombre o el precio');
  let partes;
  try{partes=CB.partes.map(pt=>{const q=parseInt(pt.cantidad,10);if(!(q>0))throw new Error('Hay una cantidad inválida');return{nombre:pt.nombre.trim()||null,cantidad:q,opciones:[...new Set(pt.ops.filter(Boolean).map(Number))]}}).filter(pt=>pt.opciones.length)}catch(e){return alert(e.message)}
  if(!partes.length)return alert('Elegí al menos un producto');
  run(async()=>{
    if(CB.id)await post('/api/admin/productos/'+CB.id,{nombre:n,precio:pr,categoria:CB.categoria||'',partes},'PATCH');
    else await post('/api/admin/productos',{nombre:n,precio:pr,es_combo:true,categoria:CB.categoria||null,partes});
    CBO=false})}
async function clEd(id){const c=CL.find(x=>x.id===id),n=await preguntar('Nombre y apellido del cliente',c.nombre);if(n===null)return;
  const ci=await preguntar('Cédula (vacío = se usa el nombre)',c.cedula&&c.cedula!==c.nombre?c.cedula:'');if(ci===null)return;
  const e=await preguntar('Empresa (vacío = sin empresa)',c.empresa||'');if(e===null)return;
  const t=await preguntar('Celular',c.telefono||'');if(t===null)return;
  run(()=>post('/api/admin/clientes/'+id,{nombre:n.trim()||c.nombre,cedula:ci.trim(),empresa:e.trim(),telefono:t.trim()},'PATCH'))}
function clNuevo(){const n=$('#cn').value.trim(),t=$('#ct').value.trim();if(n.length<2)return alert('Falta el nombre y apellido');if(!t)return alert('Falta el celular');
  run(()=>post('/api/clientes',{nombre:n,cedula:$('#cc').value.trim()||null,empresa:$('#ce').value.trim()||null,telefono:t}))}
const clHTML=()=>{const t=norm(CQ).split(/\s+/).filter(Boolean),m=new Map();
  for(const c of CL){if(!t.every(x=>norm(c.nombre+' '+(c.empresa||'')+' '+(c.cedula||'')+' '+(c.telefono||'')).includes(x)))continue;const e=c.empresa||'Sin empresa';if(!m.has(e))m.set(e,[]);m.get(e).push(c)}
  return [...m].sort((a,b)=>(a[0]==='Sin empresa')-(b[0]==='Sin empresa')||norm(a[0]).localeCompare(norm(b[0]))).map(([e,l])=>`<details class=cd style="padding:0" ${t.length?'open':''}><summary class=sm><b>${esc(e)}</b><span><small class=mut>${l.length} cliente(s)</small> <b>${gs(l.reduce((s,c)=>s+c.saldo,0))}</b></span></summary>${l.sort((a,b)=>norm(a.nombre).localeCompare(norm(b.nombre))).map(c=>`<div class=sub style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between"><div class=m style="flex:1 1 180px"><b>${esc(c.nombre)}</b><br><small class=mut>CI: ${esc(c.cedula||c.nombre)} · ${esc(c.telefono||'Sin celular')}</small></div><div class=a><b>${gs(c.saldo)}</b><button class="bt s" onclick="cliAbrir(${c.id})">Estado de cuenta</button><button class="bt s" onclick="clEd(${c.id})">Editar</button></div></div>`).join('')}</details>`).join('')||'<p class=mut>Sin resultados</p>'};
const clDraw=()=>{const e=$('#adl');if(e)e.innerHTML=clHTML()};
/* compras: la empleada carga lo básico; acá se completan costos y datos de la factura */
const pvO=t=>t==='CN'?CN:CP;
const pvListA=t=>{const q=norm(PQ).split(/\s+/).filter(Boolean);const l=PV.filter(x=>x.activo&&q.every(w=>norm(x.nombre).includes(w)));
  return l.slice(0,30).map(x=>`<div class=it style="cursor:pointer;margin-bottom:6px" onclick="pvSel('${t}',${x.id})"><div class=m>${esc(x.nombre)}${x.ruc?` <small class=mut>· RUC ${esc(x.ruc)}</small>`:''}</div></div>`).join('')
   +(PQ.trim().length>=2&&!l.length?`<button class="bt s" onclick="pvAlta('${t}')">+ Agregar «${esc(PQ.trim())}» como proveedor nuevo</button>`:'')
   ||'<p class=mut>Sin proveedores. Escribí el nombre para agregar uno.</p>'};
const pvBox=t=>{const o=pvO(t);return o.provId?`<div class=it><div class=m><small class=mut>Proveedor</small><br><b>${esc(o.prov)}</b></div><div class=a><button class="bt s" onclick="pvCambiar('${t}')">Cambiar</button></div></div>`
  :`<input type=search placeholder="Buscar proveedor" value="${esc(PQ)}" oninput="PQ=this.value;$('#pvl_${t}').innerHTML=pvListA('${t}')" style="width:100%"><div id=pvl_${t} style="max-height:200px;overflow-y:auto">${pvListA(t)}</div>`};
const pvRe=t=>{const e=$('#pvb_'+t);if(e)e.innerHTML=pvBox(t)};
function pvSel(t,id){const x=PV.find(v=>v.id===id),o=pvO(t);o.provId=id;o.prov=x.nombre;PQ='';pvRe(t)}
function pvCambiar(t){pvO(t).provId=null;PQ='';pvRe(t)}
async function pvAlta(t){try{const r=await post('/api/proveedores',{nombre:PQ.trim()});if(!PV.some(x=>x.id===r.id))PV.push(r);pvSel(t,r.id)}catch(e){alert(e.message)}}
function cpEdit(id){const c=COMPS.find(x=>x.id===id);
  CP={id,prov:c.proveedor,provId:c.proveedor_id,fac:c.factura,monto:fm(c.monto),lin:c.lineas.map(l=>({item_id:l.item_id,nombre:l.nombre,unidad:l.unidad,cantidad:l.cantidad,costo:l.costo_unit?fm(l.costo_unit):''}))};
  CN=null;PQ='';show('comp').then(()=>window.scrollTo(0,0))}
function cpHTML(){
  return `<b>Completar compra</b> <span class=mut>· las cantidades no se cambian; si hay un error de cantidad, anulá y cargá de nuevo</span><div style="margin-top:8px"></div>

const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')};
const DPER=[['hoy','Hoy'],['ayer','Ayer'],['7','7 días'],['30','30 días'],['mes','Este mes'],['mant','Mes anterior']];
function dsRango(p){const h=hoyS();
  if(p==='hoy')return[h,h];if(p==='ayer'){const a=addD(h,-1);return[a,a]}
  if(p==='7')return[addD(h,-6),h];if(p==='30')return[addD(h,-29),h];if(p==='mes')return[h.slice(0,8)+'01',h];
  const f=new Date(h.slice(0,8)+'01T12:00:00');f.setDate(0);const u=f.toLocaleDateString('en-CA');return[u.slice(0,8)+'01',u]}

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${pd.map((x,i)=>{const hc=x.contado/mx*al,hr=x.credito/mx*al,X=(i*bw+g/2).toFixed(1),w=(bw-g).toFixed(1);

  const ant=d.ventas_periodo_anterior,pct=ant?Math.round((d.total_ventas-ant)/ant*100):null;

  const mc=Math.max(0,...d.por_categoria.map(x=>x.monto)),mm=Math.max(0,...Object.values(d.por_medio));

  return `<h2>Usuarios</h2>${us.map(u=>`<div class="it ${u.activo?'':'an'}"><div class=m><b>${esc(u.nombre)}</b> <span class=mut>· ${u.rol}${u.activo?'':' · desactivado'}</span></div><div class=a><button class="bt s" onclick="usPin(${u.id})">Cambiar PIN</button><button class="bt s" onclick="usAct(${u.id},${!u.activo})">${u.activo?'Desactivar':'Activar'}</button></div></div>`).join('')}<div class=cd><input id=un placeholder="Nombre"><input id=up type=password inputmode=numeric placeholder="PIN" size=10><select id=ur><option value=empleada>Empleada</option><option value=admin>Administrador</option></select><button class="bt ok" onclick="usNuevo()">Agregar usuario</button></div>
  <h2>Clientes</h2><div class=cd><input id=cn placeholder="Nombre y apellido"><input id=cc placeholder="Cédula (si no tiene, se usa el nombre)"><input id=ce placeholder="Empresa (opcional)"><input id=ct inputmode=tel placeholder="Celular"><button class="bt ok" onclick="clNuevo()">Agregar cliente</button></div><input type=search placeholder="Buscar por nombre, empresa, cédula o celular" oninput="CQ=this.value;clDraw()" style="width:100%"><div id=adl>${clHTML()}</div><div class=it><div class=m><b>Total por cobrar</b></div><div class=a><b>${gs(cl.reduce((t,c)=>t+c.saldo,0))}</b></div></div><details class=cd style="padding:0"><summary class=sm><b>Proveedores</b><small class=mut>${pvs.length} registrado(s)</small></summary><div class=sub style="display:block"><div class=cd><input id=vn placeholder="Nombre"><input id=vr placeholder="RUC (opcional)"><input id=vt placeholder="Teléfono (opcional)"><button class="bt ok" onclick="pvNuevoA()">Agregar proveedor</button></div><input type=search placeholder="Buscar proveedor" oninput="PQ2=this.value;pvDrawA()" style="width:100%"><div id=pva>${pvHTMLA()}</div></div></details>`},
imp:async()=>`<div class=cd><p>Subí la planilla con las hojas <b>Items</b> y <b>Productos</b>. Si una fila tiene error no se carga nada y te indica cuál corregir. El stock de items que ya existen no se modifica.</p><p><a href="plantilla-carga-cantina.xlsx">Descargar la planilla modelo</a></p><input type=file id=fx accept=".xlsx"><button class="bt ok" onclick="subir()">Subir</button><div id=ri></div></div>`,
aud:async()=>{
  const[au,us,st]=await Promise.all([A('/api/admin/auditoria?limite=300'),A('/api/admin/usuarios'),A('/api/stock')]);const nm=Object.fromEntries(us.map(u=>[u.id,u.nombre])),IM=Object.fromEntries(st.map(i=>[i.id,i.nombre]));
  const L={venta_anulada:'Venta anulada',pago_anulado:'Cobro anulado',gasto_anulado:'Gasto anulado',turno_abierto:'Turno abierto',turno_cerrado:'Caja cerrada',gasto:'Gasto cargado',usuario_nuevo:'Usuario creado',usuario_editado:'Usuario modificado',producto_nuevo:'Producto creado',producto_editado:'Producto modificado',item_nuevo:'Item creado',stock_entrada:'Entrada de stock',stock_merma:'Merma de stock',importacion_excel:'Importación de Excel',cliente_nuevo:'Cliente creado',cliente_editado:'Cliente modificado',compra:'Compra de mercadería',compra_anulada:'Compra anulada',compra_editada:'Compra modificada',proveedor_nuevo:'Proveedor creado',item_editado:'Item modificado',unidad_nueva:'Unidad de medida nueva',proveedor_editado:'Proveedor modificado',stock_entradas:'Carga de stock del día',pin_cliente:'PIN de cliente',config_editada:'Configuración modificada'};
  const MK=new Set(['monto','fondo','diferencia','total','precio','precio anterior']);
  const val=(k,v)=>k==='pos'?['debito','credito'].filter(x=>v[x]).map(x=>`${x==='debito'?'Débito':'Crédito'}: app ${gs(v[x].app)} · POS ${gs(v[x].lote)} · dif. ${gs(v[x].diferencia)}`).join(' | '):MK.has(k)&&typeof v==='number'?gs(v):v&&typeof v==='object'?JSON.stringify(v):v;
  const val2=(k,v)=>typeof v==='boolean'?(v?'sí':'no'):Array.isArray(v)?(k==='receta'?v.map(r=>(IM[r.item_id]||'?')+' ×'+r.cantidad).join('; '):v.length+' elemento(s) (formato anterior)'):val(k,v);
  const dt=d=>Object.entries(d||{}).filter(([k,v])=>k!=='id'&&v!==null&&v!==undefined).map(([k,v])=>k.replace(/_/g,' ')+': '+val2(k,v)).join(' · ');
  const rows=au.filter(r=>!AF||r.accion===AF);
  return `<div class=bar><select onchange="AF=this.value;show('aud')"><option value="">Todas las acciones</option>${Object.entries(L).map(([k,n])=>`<option value=${k} ${k===AF?'selected':''}>${n}</option>`).join('')}</select><span class=mut>Últimas ${au.length} acciones · la más reciente primero · en rojo: anulaciones y cierres con diferencia</span></div>${rows.map(r=>`<div class="cd ${/anulad/.test(r.accion)||(r.accion==='turno_cerrado'&&r.detalle&&r.detalle.diferencia)?'neg':''}" style="padding:10px 14px;margin-bottom:8px"><b>${esc(L[r.accion]||r.accion)}</b> <span class=mut>· ${esc(nm[r.user_id]||r.user_id||'')} · ${hh(r.fecha)}</span><br><small>${esc(dt(r.detalle))}</small></div>`).join('')||'<p class=mut>Sin registros</p>'}`}
};
R();
</script></body></html>
